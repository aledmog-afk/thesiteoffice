<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Plot – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="site-header"></div>

<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title" id="plotTitle">Loading…</div>
      <div class="page-sub" id="projectSub"></div>
    </div>
    <button class="btn btn-danger btn-sm" id="deletePlotBtn">Delete Plot</button>
  </div>

  <div id="errorBox" class="error-box"></div>

  <h3 style="font-family:var(--font-display); font-size:1.1rem; margin-bottom:1rem;">Plot Control</h3>
  <div id="plotControlWrap" style="margin-bottom:2.5rem;">Loading…</div>

  <h3 style="font-family:var(--font-display); font-size:1.1rem; margin-bottom:1rem;">Plot Progress</h3>
  <div class="card" style="margin-bottom:2.5rem;">
    <div class="form-grid" style="align-items:end;">
      <div class="field">
        <label for="plotProgressInput">Progress complete (%)</label>
        <input type="number" id="plotProgressInput" min="0" max="100" step="1">
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-outline" id="suggestProgressBtn">Suggest from Milestones</button>
        <button type="button" class="btn btn-amber" id="saveProgressBtn">Save</button>
      </div>
    </div>
    <p class="hint" id="progressSavedHint" style="margin-top:0.5rem;"></p>
  </div>

  <h3 id="gatesSection" style="font-family:var(--font-display); font-size:1.1rem; margin-bottom:1rem;">Quality Gates</h3>
  <div id="gatesWrap" style="margin-bottom:2.5rem;">Loading…</div>

  <h3 style="font-family:var(--font-display); font-size:1.1rem; margin-bottom:1rem;">Internal Works Milestones</h3>
  <div class="card" style="margin-bottom:2.5rem;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Milestone</th><th>Status</th><th>% Complete</th></tr>
        </thead>
        <tbody id="milestoneRows"></tbody>
      </table>
    </div>
  </div>

  <h3 id="documentsSection" style="font-family:var(--font-display); font-size:1.1rem; margin-bottom:1rem;">Handover Documents</h3>
  <div class="card" style="margin-bottom:2.5rem;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Document</th><th>Status</th><th>File</th></tr>
        </thead>
        <tbody id="docRows"></tbody>
      </table>
    </div>
  </div>

  <h3 style="font-family:var(--font-display); font-size:1.1rem; margin-bottom:1rem;">Linked Items</h3>
  <div class="card">
    <div class="hint" style="margin-bottom:0.6rem;">Actions, Inspection Findings and Snags already tied to this plot — nothing to search for separately.</div>
    <div id="linkedItemsWrap">Loading…</div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { requireAuth, renderHeader, getParam, escapeHtml, showError, clearError, uploadImage, suggestPlotProgress, recalculateActualProgress, checkAndMarkPlotHandedOver, getPlotHandoverReadiness, PLOT_READINESS_LABEL, PLOT_READINESS_BADGE } from "./js/app.js";

  await requireAuth();
  const plotId = getParam("id");
  if (!plotId) window.location.href = "dashboard.html";

  const errorBox = document.getElementById("errorBox");
  let plot = null;

  // ─── Plot Control / Handover Readiness (Priority 12, Phase 1) ───
  // System Handover Readiness — derived from the configured control
  // signals below (Quality Gates, Handover Documents, Programme,
  // Snags). This is NOT a legal or contractual determination of
  // handover readiness, only a summary of what the app itself knows.
  const plotControlWrap = document.getElementById("plotControlWrap");

  function reasonHref(code) {
    if (code === "gates_outstanding") return "#gatesSection";
    if (code === "documents_outstanding") return "#documentsSection";
    if (code.startsWith("snags_")) return plot?.snagListId ? `snag-list-edit.html?id=${plot.snagListId}` : null;
    if (code.startsWith("programme_") || code === "approaching_with_unresolved") return `programme.html?project=${plot.project_id}`;
    return null;
  }

  function reasonListHtml(reasons) {
    if (!reasons.length) return "";
    return `<ul class="checklist" style="list-style:disc; padding-left:1.4rem; margin:0.4rem 0 0;">
      ${reasons.map((r) => {
        const href = reasonHref(r.code);
        const text = escapeHtml(r.label);
        return `<li style="display:list-item;">${href ? `<a href="${href}">${text}</a>` : text}</li>`;
      }).join("")}
    </ul>`;
  }

  function renderPlotControl(readiness) {
    const status = readiness.status;
    const badge = PLOT_READINESS_BADGE[status];
    const label = PLOT_READINESS_LABEL[status];

    let headline = `<span class="badge ${badge}" style="font-size:0.95rem; padding:0.3rem 0.7rem;">${label}</span>`;
    if (status === "not_ready") headline += ` <strong>${readiness.blockers.length} blocker${readiness.blockers.length === 1 ? "" : "s"}</strong>`;
    else if (status === "at_risk") headline += ` <strong>${readiness.warnings.length} warning${readiness.warnings.length === 1 ? "" : "s"}</strong>`;

    let restrictedNote = "";
    if (status === "restricted") {
      restrictedNote = `<p class="hint" style="margin-top:0.5rem;">Quality Gates, Handover Documents and Programme aren't visible at your access level — this position reflects Snagging only.</p>`;
    }
    let handedOverNote = "";
    if (status === "handed_over" && (readiness.blockers.length || readiness.warnings.length)) {
      handedOverNote = `<p class="hint" style="margin-top:0.5rem;">Note: new item(s) have been raised since this plot was marked handed over — see below.</p>`;
    }

    plotControlWrap.innerHTML = `
      <div class="card" style="margin-bottom:1rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.6rem; margin-bottom:0.3rem;">
          <strong>System Handover Readiness</strong>
          <span class="hint">As of ${new Date().toLocaleDateString("en-GB")} — derived from the control signals below, not a legal/contractual determination.</span>
        </div>
        <p style="margin:0.4rem 0 0;">${headline}</p>
        ${restrictedNote}${handedOverNote}
        ${readiness.blockers.length ? `<div style="margin-top:0.7rem;"><strong style="color:var(--red);">Blockers</strong>${reasonListHtml(readiness.blockers)}</div>` : ""}
        ${readiness.warnings.length ? `<div style="margin-top:0.7rem;"><strong style="color:var(--amber, #b5860b);">Warnings</strong>${reasonListHtml(readiness.warnings)}</div>` : ""}
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:0.8rem;">
        <div class="card">
          <div class="hint">Programme</div>
          ${readiness.programme.hasActivities
            ? `<div>${readiness.programme.total} activit${readiness.programme.total === 1 ? "y" : "ies"} tagged to this plot</div>
               <div class="hint">Overdue: ${readiness.programme.overdueProgrammeActivities + readiness.programme.overdueProgrammeMilestones} · Forecast late: ${readiness.programme.materialForecastLateProgrammeActivities + readiness.programme.forecastLateProgrammeMilestones}</div>`
            : `<div class="hint">No programme activities tagged to this plot</div>`}
        </div>
        <div class="card">
          <div class="hint">Snags</div>
          <div>${readiness.snags.open} open of ${readiness.snags.total}</div>
          <div class="hint">Blocking: ${readiness.snags.blocking} · Warning: ${readiness.snags.warning}</div>
        </div>
        <div class="card">
          <div class="hint">Quality Gates</div>
          ${readiness.qualityGates.total
            ? `<div>${readiness.qualityGates.approved} of ${readiness.qualityGates.total} approved / N/A</div>`
            : `<div class="hint">No quality gates recorded</div>`}
        </div>
        <div class="card">
          <div class="hint">Handover Documents</div>
          ${readiness.handoverDocuments.total
            ? `<div>${readiness.handoverDocuments.approved} of ${readiness.handoverDocuments.total} approved / final</div>`
            : `<div class="hint">No handover documents recorded</div>`}
        </div>
        <div class="card">
          <div class="hint">Actions</div>
          ${readiness.actions.total
            ? `<div>${readiness.actions.open} open of ${readiness.actions.total}</div><div class="hint">Blocking: ${readiness.actions.blocking} · Warning: ${readiness.actions.warning}</div>`
            : `<div class="hint">0 Actions linked to this plot — not necessarily clean; a project-level Action may exist unlinked</div>`}
        </div>
        <div class="card">
          <div class="hint">Inspection Findings</div>
          ${readiness.findings.total
            ? `<div>${readiness.findings.open} open of ${readiness.findings.total}</div><div class="hint">Critical: ${readiness.findings.blocking} · High: ${readiness.findings.warning}</div>`
            : `<div class="hint">0 Findings linked to this plot — not necessarily clean; a project-level Finding may exist unlinked</div>`}
        </div>
      </div>
    `;
  }

  async function loadPlotControl() {
    try {
      const { readiness } = await getPlotHandoverReadiness(plotId);
      const { data: list } = await supabase.from("snag_lists").select("id").eq("plot_id", plotId).maybeSingle();
      plot.snagListId = list?.id || null;
      renderPlotControl(readiness);
    } catch (err) {
      plotControlWrap.innerHTML = `<div class="error-box" style="display:block;">Couldn't load plot control position: ${escapeHtml(err.message || String(err))}</div>`;
    }
  }

  // ─── Linked Items (Priority 13) ──────────────────────────────────
  // "Plot -> Finding -> Action" and "Plot -> Snag -> Action" without
  // manually searching. Actions/Findings are reached via their own new
  // plot_id (Priority 13); Snags via the plot's own auto-seeded list —
  // the same effective-plot resolution getPlotSnags()/
  // getProjectPlotReadiness() already use internally, mirrored here
  // (kept local rather than exported from app.js purely for display,
  // since nothing else outside this page needs the raw list).
  function linkedItemRowHtml(label, href, statusBadge) {
    return `<div style="display:flex; align-items:center; justify-content:space-between; gap:0.6rem; padding:0.4rem 0; border-bottom:1px solid var(--rule);">
      <a href="${href}">${escapeHtml(label)}</a>${statusBadge}
    </div>`;
  }

  async function loadLinkedItems() {
    const wrap = document.getElementById("linkedItemsWrap");
    try {
      const [{ data: actions }, { data: findings }, { data: list }] = await Promise.all([
        supabase.from("actions").select("id, title, status, priority").eq("plot_id", plotId),
        supabase.from("inspection_findings").select("id, title, severity, status, inspection_id").eq("plot_id", plotId),
        supabase.from("snag_lists").select("id").eq("plot_id", plotId).maybeSingle(),
      ]);
      const { data: directTagged } = await supabase.from("snag_items").select("id, description, status, snag_list_id").eq("plot_id", plotId);
      const { data: byList } = list?.id
        ? await supabase.from("snag_items").select("id, description, status, snag_list_id").eq("snag_list_id", list.id)
        : { data: [] };
      const snagsById = new Map();
      for (const s of [...(byList || []), ...(directTagged || [])]) snagsById.set(s.id, s);
      const snags = [...snagsById.values()];

      const sections = [
        ["Actions", actions || [], (a) => linkedItemRowHtml(a.title, `actions.html?project=${plot.project_id}`, `<span class="badge ${a.status === "completed" ? "badge-green" : a.status === "blocked" ? "badge-red" : "badge-grey"}">${escapeHtml(a.status)}</span>`)],
        ["Inspection Findings", findings || [], (f) => linkedItemRowHtml(f.title, `inspection-detail.html?id=${f.inspection_id}`, `<span class="badge ${f.severity === "critical" || f.severity === "high" ? "badge-red" : "badge-grey"}">${escapeHtml(f.status)}</span>`)],
        ["Snags", snags, (s) => linkedItemRowHtml(s.description, `snag-list-edit.html?id=${s.snag_list_id}`, `<span class="badge ${s.status === "open" ? "badge-red" : "badge-green"}">${escapeHtml(s.status)}</span>`)],
      ];

      wrap.innerHTML = sections.map(([label, rows, rowFn]) => `
        <div style="margin-bottom:1rem;">
          <strong>${label}</strong> <span class="hint">(${rows.length})</span>
          ${rows.length ? rows.map(rowFn).join("") : `<div class="hint" style="padding:0.3rem 0;">None</div>`}
        </div>
      `).join("");
    } catch (err) {
      wrap.innerHTML = `<div class="error-box" style="display:block;">Couldn't load linked items: ${escapeHtml(err.message || String(err))}</div>`;
    }
  }

  // ─── Quality Gates ──────────────────────────────────────────────
  const gateStatusBadge = { not_started: "badge-grey", in_progress: "badge-blue", under_review: "badge-amber", approved: "badge-green", not_applicable: "badge-grey" };
  const gateStatusLabel = { not_started: "Not Started", in_progress: "In Progress", under_review: "Under Review", approved: "Approved", not_applicable: "N/A" };
  const gatesWrap = document.getElementById("gatesWrap");

  function gateCardHtml(gate) {
    const checklist = Array.isArray(gate.checklist) ? gate.checklist : [];
    return `
      <div class="card gate-card" data-gate-id="${gate.id}">
        <div class="gate-head">
          <div>
            <span class="badge ${gateStatusBadge[gate.status]}" style="margin-bottom:0.4rem; display:inline-block;">${gateStatusLabel[gate.status]}</span>
            <div class="gate-head-title">${escapeHtml(gate.title)}</div>
          </div>
          <select class="gate-status-select" data-gate-id="${gate.id}">
            <option value="not_started">Not Started</option>
            <option value="in_progress">In Progress</option>
            <option value="under_review">Under Review</option>
            <option value="approved">Approved</option>
            <option value="not_applicable">N/A</option>
          </select>
        </div>
        <ul class="checklist">
          ${checklist.map((item, i) => `
            <li class="checklist-item ${item.checked ? "checked" : ""}">
              <input type="checkbox" id="chk-${gate.id}-${i}" data-gate-id="${gate.id}" data-index="${i}" ${item.checked ? "checked" : ""}>
              <label for="chk-${gate.id}-${i}">${escapeHtml(item.text)}</label>
              <span class="checked-at">${item.checked_at ? new Date(item.checked_at).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
  }

  function wireGateCard(gate) {
    const select = document.querySelector(`select.gate-status-select[data-gate-id="${gate.id}"]`);
    select.value = gate.status;
    select.addEventListener("change", async () => {
      const newStatus = select.value;
      const { error } = await supabase.from("quality_gates").update({ status: newStatus }).eq("id", gate.id);
      if (error) { alert("Couldn't save that status change: " + error.message); select.value = gate.status; return; }
      gate.status = newStatus;
      await checkAndMarkPlotHandedOver(plotId);
      rerenderGateCard(gate);
      loadPlotControl();
    });

    document.querySelectorAll(`input[type="checkbox"][data-gate-id="${gate.id}"]`).forEach((cb) => {
      cb.addEventListener("change", async () => {
        const i = Number(cb.dataset.index);
        const previousChecklist = gate.checklist;
        const checklist = Array.isArray(gate.checklist) ? [...gate.checklist] : [];
        checklist[i] = { ...checklist[i], checked: cb.checked, checked_at: cb.checked ? new Date().toISOString() : null };
        const { error } = await supabase.from("quality_gates").update({ checklist }).eq("id", gate.id);
        if (error) { alert("Couldn't save that checklist change: " + error.message); gate.checklist = previousChecklist; rerenderGateCard(gate); return; }
        gate.checklist = checklist;
        rerenderGateCard(gate);
      });
    });
  }

  function rerenderGateCard(gate) {
    const el = document.querySelector(`.gate-card[data-gate-id="${gate.id}"]`);
    el.outerHTML = gateCardHtml(gate);
    wireGateCard(gate);
  }

  async function loadGates() {
    const { data: gates, error } = await supabase
      .from("quality_gates")
      .select("*")
      .eq("plot_id", plotId)
      .order("sort_order", { ascending: true });

    if (error || !gates || !gates.length) {
      gatesWrap.innerHTML = `<div class="empty"><p>No quality gates found for this plot.</p></div>`;
      return;
    }
    gatesWrap.innerHTML = gates.map(gateCardHtml).join("");
    gates.forEach(wireGateCard);
  }

  // ─── Internal Works Milestones ───────────────────────────────────
  // A second, more granular layer of progress alongside the Plot
  // Progress % above and the 4 Quality Gates — one row per named trade
  // stage (Timber Frame, First/Second Fix per trade, Kitchen,
  // Decoration, Snagging, etc.), each its own 0-100% rather than a
  // status enum, since real trackers record genuine partial completion
  // per stage. Deliberately independent of Plot Progress — editing one
  // never touches the other.
  function milestoneStatusBadge(pct) {
    return pct <= 0 ? "badge-grey" : pct >= 100 ? "badge-green" : "badge-blue";
  }
  function milestoneStatusLabel(pct) {
    return pct <= 0 ? "Not Started" : pct >= 100 ? "Complete" : "In Progress";
  }

  function milestoneRowHtml(m) {
    return `
      <tr data-milestone-id="${m.id}">
        <td><strong>${escapeHtml(m.title)}</strong></td>
        <td><span class="badge ${milestoneStatusBadge(m.percent)}">${milestoneStatusLabel(m.percent)}</span></td>
        <td><input type="number" class="milestone-percent" data-milestone-id="${m.id}" min="0" max="100" step="5" value="${m.percent}" style="width:90px;"></td>
      </tr>
    `;
  }

  function wireMilestoneRow(m) {
    const input = document.querySelector(`input.milestone-percent[data-milestone-id="${m.id}"]`);
    input.addEventListener("change", async () => {
      const previousPercent = m.percent;
      const pct = Math.max(0, Math.min(100, Number(input.value) || 0));
      const { error } = await supabase.from("internal_milestones").update({ percent: pct }).eq("id", m.id);
      if (error) { alert("Couldn't save that percentage: " + error.message); m.percent = previousPercent; rerenderMilestoneRow(m); return; }
      m.percent = pct;
      rerenderMilestoneRow(m);
    });
  }

  function rerenderMilestoneRow(m) {
    const el = document.querySelector(`tr[data-milestone-id="${m.id}"]`);
    el.outerHTML = milestoneRowHtml(m);
    wireMilestoneRow(m);
  }

  async function loadMilestones() {
    const { data: milestones, error } = await supabase
      .from("internal_milestones")
      .select("*")
      .eq("plot_id", plotId)
      .order("sort_order", { ascending: true });

    if (error || !milestones || !milestones.length) {
      document.getElementById("milestoneRows").innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--ink-soft);">No internal works milestones found for this plot.</td></tr>`;
      return;
    }
    document.getElementById("milestoneRows").innerHTML = milestones.map(milestoneRowHtml).join("");
    milestones.forEach(wireMilestoneRow);
  }

  // ─── Handover Documents ─────────────────────────────────────────
  const docStatusBadge = { missing: "badge-red", draft_received: "badge-amber", approved_final: "badge-green" };
  const docStatusLabel = { missing: "Missing", draft_received: "Draft Received", approved_final: "Approved / Final" };

  function docRowHtml(doc) {
    return `
      <tr data-doc-id="${doc.id}">
        <td><strong>${escapeHtml(doc.title)}</strong></td>
        <td>
          <select class="status-select" data-doc-id="${doc.id}" style="width:auto;">
            <option value="missing">Missing</option>
            <option value="draft_received">Draft Received</option>
            <option value="approved_final">Approved / Final</option>
          </select>
        </td>
        <td class="file-row">
          ${doc.file_url ? `<a class="file-link" href="${doc.file_url}" target="_blank">📄 ${escapeHtml(doc.file_name || "View file")}</a><br>` : ""}
          <input type="file" data-doc-id="${doc.id}" accept="application/pdf,image/*">
        </td>
      </tr>
    `;
  }

  function wireDocRow(doc) {
    const select = document.querySelector(`select.status-select[data-doc-id="${doc.id}"]`);
    select.value = doc.status;
    select.addEventListener("change", async () => {
      const newStatus = select.value;
      const { error } = await supabase.from("handover_documents").update({ status: newStatus, updated_at: new Date().toISOString() }).eq("id", doc.id);
      if (error) { alert("Couldn't save that status change: " + error.message); select.value = doc.status; return; }
      doc.status = newStatus;
      await checkAndMarkPlotHandedOver(plotId);
      loadPlotControl();
    });

    const fileInput = document.querySelector(`input[type="file"][data-doc-id="${doc.id}"]`);
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      clearError(errorBox);
      fileInput.disabled = true;
      try {
        const url = await uploadImage(file, `${plot.project_id}/handover`);
        const patch = { file_url: url, file_name: file.name, updated_at: new Date().toISOString() };
        if (doc.status === "missing") patch.status = "draft_received";
        const { error } = await supabase.from("handover_documents").update(patch).eq("id", doc.id);
        if (error) throw error;
        Object.assign(doc, patch);
        rerenderDocRow(doc);
      } catch (err) {
        showError(errorBox, err);
      } finally {
        fileInput.disabled = false;
      }
    });
  }

  function rerenderDocRow(doc) {
    const el = document.querySelector(`tr[data-doc-id="${doc.id}"]`);
    el.outerHTML = docRowHtml(doc);
    wireDocRow(doc);
  }

  async function loadDocs() {
    const { data, error } = await supabase
      .from("handover_documents")
      .select("*")
      .eq("plot_id", plotId)
      .order("doc_key", { ascending: true });

    if (error || !data || !data.length) {
      document.getElementById("docRows").innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--ink-soft);">No handover documents found for this plot.</td></tr>`;
      return;
    }
    document.getElementById("docRows").innerHTML = data.map(docRowHtml).join("");
    data.forEach(wireDocRow);
  }

  // ─── Plot progress ──────────────────────────────────────────────
  document.getElementById("suggestProgressBtn").addEventListener("click", async () => {
    const btn = document.getElementById("suggestProgressBtn");
    btn.disabled = true;
    btn.textContent = "Checking weekly reports…";
    const suggested = await suggestPlotProgress(plot.project_id, plot.plot_number);
    document.getElementById("plotProgressInput").value = suggested;
    document.getElementById("progressSavedHint").textContent = `Suggested from logged milestones — review and hit Save to apply.`;
    btn.disabled = false;
    btn.textContent = "Suggest from Milestones";
  });

  document.getElementById("saveProgressBtn").addEventListener("click", async () => {
    clearError(errorBox);
    const val = document.getElementById("plotProgressInput").value;
    const pct = Math.max(0, Math.min(100, Number(val) || 0));
    const saveBtn = document.getElementById("saveProgressBtn");
    saveBtn.disabled = true;
    try {
      const { error } = await supabase.from("plots").update({ progress_pct: pct }).eq("id", plotId);
      if (error) throw error;
      plot.progress_pct = pct;
      await recalculateActualProgress(plot.project_id);
      document.getElementById("progressSavedHint").textContent = "Saved — site's Actual Progress has been updated.";
    } catch (err) {
      showError(errorBox, err);
    } finally {
      saveBtn.disabled = false;
    }
  });

  // ─── Delete plot ────────────────────────────────────────────────
  document.getElementById("deletePlotBtn").addEventListener("click", async () => {
    if (!confirm(`Delete "${plot.plot_number}" and all its quality gates and handover documents? This cannot be undone.`)) return;
    const { error } = await supabase.from("plots").delete().eq("id", plotId);
    if (error) { showError(errorBox, error); return; }
    window.location.href = plot.block_id
      ? `block-detail.html?id=${plot.block_id}`
      : `plot-handovers.html?project=${plot.project_id}`;
  });

  // ─── Init ───────────────────────────────────────────────────────
  async function init() {
    const { data, error } = await supabase.from("plots").select("*, projects(*), blocks(*)").eq("id", plotId).single();
    if (error) { document.getElementById("plotTitle").textContent = "Plot not found"; return; }
    plot = data;
    const project = plot.projects;
    const block = plot.blocks;

    document.getElementById("plotTitle").textContent = plot.plot_number;
    document.getElementById("projectSub").textContent = block ? `${project.name} — part of ${block.block_name}` : project.name;
    document.getElementById("plotProgressInput").value = plot.progress_pct || 0;
    document.getElementById("deletePlotBtn").textContent = block ? "Delete Flat" : "Delete Plot";
    renderHeader(block ? [
      { label: "Dashboard", href: "dashboard.html" },
      { label: project.name, href: `project.html?id=${project.id}` },
      { label: "Plot Handovers", href: `plot-handovers.html?project=${project.id}` },
      { label: block.block_name, href: `block-detail.html?id=${block.id}` },
      { label: plot.plot_number },
    ] : [
      { label: "Dashboard", href: "dashboard.html" },
      { label: project.name, href: `project.html?id=${project.id}` },
      { label: "Plot Handovers", href: `plot-handovers.html?project=${project.id}` },
      { label: plot.plot_number },
    ]);

    loadGates();
    loadMilestones();
    loadDocs();
    loadPlotControl();
    loadLinkedItems();
  }

  init();
</script>
</body>
</html>
