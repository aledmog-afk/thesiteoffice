<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Sign In – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">SITE <span>TRACKER</span></div>
    <p class="auth-sub">Weekly reports &amp; snagging sheets</p>

    <div id="errorBox" class="error-box"></div>
    <div id="infoBox" class="error-box" style="background:var(--green-light); color:var(--green);"></div>

    <form id="authForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" minlength="6">
      </div>
      <p class="hint" id="forgotHint" style="display:none; margin:-0.4rem 0 0.8rem;">We'll email a link to set a new password.</p>
      <button type="submit" class="btn btn-amber" style="width:100%;" id="submitBtn">Sign In</button>
    </form>

    <div class="auth-toggle" id="forgotRow">
      <button type="button" id="forgotBtn">Forgot password?</button>
    </div>
    <div class="auth-toggle" id="signupToggleRow">
      <span id="toggleText">Need an account?</span>
      <button type="button" id="toggleBtn">Create one</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { showError, clearError, getParam } from "./js/app.js";

  const next = getParam("next") || "dashboard.html";

  const form = document.getElementById("authForm");
  const errorBox = document.getElementById("errorBox");
  const infoBox = document.getElementById("infoBox");
  const submitBtn = document.getElementById("submitBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const toggleText = document.getElementById("toggleText");
  const forgotBtn = document.getElementById("forgotBtn");
  const forgotRow = document.getElementById("forgotRow");
  const passwordField = document.getElementById("passwordField");
  const passwordInput = document.getElementById("password");
  const forgotHint = document.getElementById("forgotHint");
  const signupToggleRow = document.getElementById("signupToggleRow");
  let mode = "signin";

  // Resolves where a signed-in user should actually land: `next` (the
  // dashboard, by default) if they already have at least one approved
  // organisation membership, or onboarding.html if they don't — covering
  // not just a brand-new signup but also an existing user who somehow
  // still has zero organisations (e.g. their only membership was
  // removed) and anyone whose only relationship to an organisation is a
  // still-pending join REQUEST (organisation_membership_requests is a
  // separate table — see sql/schema.sql v42 — so a pending request never
  // shows up here). Deliberately reads the real organisation_members
  // table through the ordinary RLS-protected client, exactly the way any
  // other page in this app reads its own data — never inferred from
  // anything client-side/spoofable, and the `.eq("user_id", userId)`
  // filter combined with organisation_members' own RLS policy means this
  // can only ever return the caller's own rows, never another user's.
  async function landingPageFor(userId) {
    const { data } = await supabase.from("organisation_members").select("id").eq("user_id", userId).limit(1);
    return (data && data.length > 0) ? next : "onboarding.html";
  }

  // If already signed in, go straight to the dashboard (or wherever "next"
  // points) — or to onboarding.html first, if they have no organisation yet.
  supabase.auth.getSession().then(async ({ data: { session } }) => {
    if (session) window.location.href = await landingPageFor(session.user.id);
  });

  function applyMode() {
    const isForgot = mode === "forgot";
    passwordField.style.display = isForgot ? "none" : "block";
    passwordInput.required = !isForgot;
    forgotHint.style.display = isForgot ? "block" : "none";
    forgotRow.style.display = isForgot ? "none" : "block";
    signupToggleRow.style.display = isForgot ? "none" : "block";
    submitBtn.textContent = isForgot ? "Send Reset Link" : (mode === "signin" ? "Sign In" : "Create Account");
    toggleText.textContent = mode === "signin" ? "Need an account?" : "Already have one?";
    toggleBtn.textContent = mode === "signin" ? "Create one" : "Sign in";
  }

  toggleBtn.addEventListener("click", () => {
    mode = mode === "signin" ? "signup" : "signin";
    applyMode();
    infoBox.style.display = "none";
    clearError(errorBox);
  });

  forgotBtn.addEventListener("click", () => {
    mode = "forgot";
    applyMode();
    infoBox.style.display = "none";
    clearError(errorBox);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errorBox);
    infoBox.style.display = "none";
    submitBtn.disabled = true;
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    try {
      if (mode === "forgot") {
        // resetPasswordForEmail() never reveals whether the address has an
        // account — Supabase's own API responds the same way either way —
        // so this message is shown regardless of the outcome, and only a
        // genuine failure (bad request, rate limit) throws below.
        const redirectTo = new URL("reset-password.html", window.location.href).href;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) throw error;
        infoBox.style.background = "var(--green-light)";
        infoBox.style.color = "var(--green)";
        infoBox.textContent = "If that email has an account, a password reset link is on its way.";
        infoBox.style.display = "block";
        mode = "signin";
        applyMode();
      } else if (mode === "signin") {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = await landingPageFor(data.user.id);
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          // A brand-new account, not an existing user signing back in —
          // send them to the organisation choice (create own / join
          // existing) rather than straight to the dashboard. Deliberately
          // NOT applied to the signin branch above: an existing user
          // signing in always goes straight to `next`, unchanged.
          window.location.href = "onboarding.html";
        } else {
          infoBox.style.background = "var(--green-light)";
          infoBox.style.color = "var(--green)";
          infoBox.textContent = "Account created. Check your email to confirm, then sign in.";
          infoBox.style.display = "block";
        }
      }
    } catch (err) {
      showError(errorBox, err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
