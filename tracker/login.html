<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">SITE <span>TRACKER</span></div>
    <p class="auth-sub">Weekly reports &amp; snagging sheets</p>

    <div id="errorBox" class="error-box"></div>
    <div id="infoBox" class="error-box" style="background:var(--green-light); color:var(--green);"></div>

    <form id="authForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-amber" style="width:100%;" id="submitBtn">Sign In</button>
    </form>

    <div class="auth-toggle">
      <span id="toggleText">Need an account?</span>
      <button type="button" id="toggleBtn">Create one</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { showError, clearError } from "./js/app.js";

  const form = document.getElementById("authForm");
  const errorBox = document.getElementById("errorBox");
  const infoBox = document.getElementById("infoBox");
  const submitBtn = document.getElementById("submitBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const toggleText = document.getElementById("toggleText");
  let mode = "signin";

  // If already signed in, go straight to the dashboard.
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = "dashboard.html";
  });

  toggleBtn.addEventListener("click", () => {
    mode = mode === "signin" ? "signup" : "signin";
    submitBtn.textContent = mode === "signin" ? "Sign In" : "Create Account";
    toggleText.textContent = mode === "signin" ? "Need an account?" : "Already have one?";
    toggleBtn.textContent = mode === "signin" ? "Create one" : "Sign in";
    infoBox.style.display = "none";
    clearError(errorBox);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errorBox);
    infoBox.style.display = "none";
    submitBtn.disabled = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "dashboard.html";
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          window.location.href = "dashboard.html";
        } else {
          infoBox.style.background = "var(--green-light)";
          infoBox.style.color = "var(--green)";
          infoBox.textContent = "Account created. Check your email to confirm, then sign in.";
          infoBox.style.display = "block";
        }
      }
    } catch (err) {
      showError(errorBox, err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
