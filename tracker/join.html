<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Site – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">SITE <span>TRACKER</span></div>
    <p class="auth-sub" id="statusText">Joining site…</p>
    <div id="errorBox" class="error-box"></div>
    <div class="btn-row" id="actionsRow" style="display:none; justify-content:center;">
      <a class="btn btn-amber" href="dashboard.html">Go to Dashboard</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { getParam, showError } from "./js/app.js";

  const statusText = document.getElementById("statusText");
  const errorBox = document.getElementById("errorBox");
  const actionsRow = document.getElementById("actionsRow");
  const code = getParam("code");

  if (!code) {
    statusText.textContent = "This invite link is missing its code.";
    actionsRow.style.display = "flex";
  } else {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = `login.html?next=${encodeURIComponent(window.location.pathname.split("/").pop() + window.location.search)}`;
    } else {
      try {
        const { data: joinedProjectId, error } = await supabase.rpc("join_project_by_invite", { invite_code_param: code });
        if (error) throw error;
        if (!joinedProjectId) {
          statusText.textContent = "This invite link is invalid or has been revoked.";
          actionsRow.style.display = "flex";
        } else {
          window.location.href = `project.html?id=${joinedProjectId}`;
        }
      } catch (err) {
        statusText.textContent = "Something went wrong joining this site.";
        showError(errorBox, err);
        actionsRow.style.display = "flex";
      }
    }
  }
</script>
</body>
</html>
