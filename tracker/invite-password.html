<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/theme-init.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Set Your Password – The Site Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">THE SITE <span>OFFICE</span></div>
    <p class="auth-sub" id="subText">Checking your invite…</p>

    <div id="errorBox" class="error-box"></div>

    <form id="setPasswordForm" style="display:none;">
      <div class="field">
        <label for="password">Choose a password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-amber btn-block" id="submitBtn">Set Password &amp; Continue</button>
    </form>

    <div class="auth-toggle" id="invalidRow" style="display:none;">
      <a href="login.html">Back to sign in</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { showError, clearError, getParam } from "./js/app.js";

  const subText = document.getElementById("subText");
  const errorBox = document.getElementById("errorBox");
  const form = document.getElementById("setPasswordForm");
  const invalidRow = document.getElementById("invalidRow");
  const submitBtn = document.getElementById("submitBtn");

  // The party-invite token travels as a plain query param (?t=...), not
  // the URL fragment: Supabase's own invite link appends ITS OWN
  // access/refresh tokens to the fragment when the recipient clicks it
  // (see supabase/functions/invite-party-user/'s redirectTo), and a
  // query param survives that append untouched. invite.html itself
  // already falls back to reading the token out of sessionStorage (the
  // same fallback a directly-opened invite.html#t=... link always
  // used) — nothing about invite.html needed to change for this.
  const partyToken = getParam("t");

  function showInvalid() {
    subText.textContent = "This invite link is invalid or has expired. Ask whoever sent it for a new one.";
    invalidRow.style.display = "block";
  }
  function showForm() {
    subText.textContent = "Welcome — choose a password to finish setting up your account.";
    form.style.display = "block";
  }

  // Clicking the emailed invite link signs the visitor in automatically
  // — the Supabase client picks up the access/refresh tokens Supabase
  // appended to the URL fragment and fires an auth event (SIGNED_IN for
  // an invite link; PASSWORD_RECOVERY is handled too, defensively,
  // since GoTrue's own event for an admin-generated invite isn't
  // contractually documented). There's no account to require an
  // existing session for, so this page never calls requireAuth() — a
  // stale or already-used link arriving with no session at all is
  // expected, not an auth failure to redirect away from.
  let ready = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_IN" || event === "PASSWORD_RECOVERY") {
      ready = true;
      showForm();
    }
  });

  const { data: { session } } = await supabase.auth.getSession();
  if (!ready && session) {
    ready = true;
    showForm();
  }
  if (!ready) {
    setTimeout(() => { if (!ready) showInvalid(); }, 2000);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errorBox);
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password !== confirmPassword) {
      showError(errorBox, { message: "Those passwords don't match." });
      return;
    }
    submitBtn.disabled = true;
    try {
      const { error } = await supabase.auth.updateUser({ password });
      if (error) throw error;
      // Hand the party-invite token to invite.html the same way a
      // directly-opened invite.html#t=... link already does, then go
      // straight there to join the company — or to the dashboard if
      // this page was somehow opened with no invite token at all.
      if (partyToken) {
        window.sessionStorage.setItem("partyInviteToken", partyToken);
        window.location.href = "invite.html";
      } else {
        window.location.href = "dashboard.html";
      }
    } catch (err) {
      showError(errorBox, err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
