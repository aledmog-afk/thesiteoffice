<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Reset Password – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">SITE <span>TRACKER</span></div>
    <p class="auth-sub" id="subText">Checking your reset link…</p>

    <div id="errorBox" class="error-box"></div>
    <div id="infoBox" class="error-box" style="background:var(--green-light); color:var(--green);"></div>

    <form id="resetForm" style="display:none;">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="btn btn-amber" style="width:100%;" id="submitBtn">Set New Password</button>
    </form>

    <div class="auth-toggle" id="invalidRow" style="display:none;">
      <a href="login.html">Back to sign in</a>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { showError, clearError } from "./js/app.js";

  const subText = document.getElementById("subText");
  const errorBox = document.getElementById("errorBox");
  const infoBox = document.getElementById("infoBox");
  const resetForm = document.getElementById("resetForm");
  const invalidRow = document.getElementById("invalidRow");
  const submitBtn = document.getElementById("submitBtn");

  function showInvalid() {
    subText.textContent = "This reset link is invalid or has expired.";
    invalidRow.style.display = "block";
  }

  function showForm() {
    subText.textContent = "Choose a new password for your account.";
    resetForm.style.display = "block";
  }

  // Clicking the emailed link brings the visitor here with a one-time
  // recovery token in the URL, which the Supabase client detects and
  // exchanges for a temporary session automatically on load — signalled
  // by a PASSWORD_RECOVERY auth event, not a normal sign-in. There's no
  // account to be signed into otherwise, so this page never calls
  // requireAuth(): arriving with no valid token is expected (a stale or
  // already-used link), not an auth failure to redirect away from.
  let ready = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      ready = true;
      showForm();
    }
  });

  const { data: { session } } = await supabase.auth.getSession();
  if (!ready && session) {
    ready = true;
    showForm();
  }
  if (!ready) {
    setTimeout(() => { if (!ready) showInvalid(); }, 2000);
  }

  resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errorBox);
    infoBox.style.display = "none";
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password !== confirmPassword) {
      showError(errorBox, { message: "Those passwords don't match." });
      return;
    }
    submitBtn.disabled = true;
    try {
      const { error } = await supabase.auth.updateUser({ password });
      if (error) throw error;
      infoBox.style.background = "var(--green-light)";
      infoBox.style.color = "var(--green)";
      infoBox.textContent = "Password updated. Taking you to your dashboard…";
      infoBox.style.display = "block";
      resetForm.style.display = "none";
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
    } catch (err) {
      showError(errorBox, err);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
