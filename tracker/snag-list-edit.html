<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Snag List – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="site-header"></div>

<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title" id="listTitle">Loading…</div>
      <div class="page-sub" id="projectSub"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger btn-sm" id="deleteListBtn" style="display:none;">Delete List</button>
      <a class="btn btn-outline" id="viewLink" href="#" target="_blank">Download PDF</a>
      <button class="btn btn-amber" id="newSnagBtn">+ Add Item</button>
    </div>
  </div>

  <div class="card" id="snagCard" style="display:none;">
    <div id="errorBox" class="error-box"></div>
    <form id="snagForm">
      <input type="hidden" id="editingId">
      <div class="field" id="plotFieldWrap" style="display:none;">
        <label for="itemPlot">Plot</label>
        <select id="itemPlot">
          <option value="">External / Site-wide</option>
        </select>
      </div>
      <div class="form-grid">
        <div class="field"><label for="location">Location *</label><input type="text" id="location" required placeholder="e.g. First floor bathroom, Kitchen"></div>
        <div class="field"><label for="trade">Trade responsible</label><input type="text" id="trade" placeholder="e.g. Plumbing"></div>
      </div>
      <div class="field"><label for="description">Description *</label><textarea id="description" rows="2" required placeholder="What's wrong and where exactly"></textarea></div>
      <div class="form-grid">
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority"></select>
        </div>
        <div class="field">
          <label for="dueDate">Due date</label>
          <input type="date" id="dueDate">
        </div>
      </div>
      <div class="field">
        <label for="assignedTo">Assigned to</label>
        <select id="assignedTo"><option value="">Unassigned</option></select>
      </div>
      <div class="field">
        <label>Photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <div class="photo-grid" id="photoGrid"></div>
      </div>
      <!-- v52: only meaningful once a snag actually exists (snag_photos
           rows need a real snag_id) — hidden while adding a brand-new
           item, shown once editing an existing one. -->
      <div id="extraPhotosWrap" style="display:none;">
        <div class="field">
          <label>Additional Photos <span class="hint">(more angles of the problem)</span></label>
          <input type="file" id="problemPhotoInput" accept="image/*">
          <div class="photo-grid" id="problemPhotoGrid"></div>
        </div>
        <div class="field">
          <label>Completion Evidence <span class="hint">(photos proving the fix — attach one or more, then use Complete on the list below)</span></label>
          <input type="file" id="completionEvidenceInput" accept="image/*">
          <div class="photo-grid" id="completionEvidenceGrid"></div>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn-amber" id="saveBtn">Add Item</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <div class="card" id="bulkBar" style="display:none; margin-bottom:1rem;">
    <div class="btn-row" style="align-items:center; flex-wrap:wrap;">
      <strong id="bulkCount"></strong>
      <select id="bulkAssignSelect" style="width:auto;"><option value="">Unassigned</option></select>
      <button type="button" class="btn btn-amber btn-sm" id="bulkAssignBtn">Assign</button>
      <button type="button" class="btn btn-outline btn-sm" id="bulkClearBtn">Clear selection</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead id="tableHead">
          <tr><th>#</th><th>Location</th><th>Description</th><th>Trade</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="snagRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty" style="display:none;"><p>No items in this list yet.</p></div>
  </div>
</div>

<!-- v52: a single shared, hidden file input for "Complete with Photo" —
     completingSnagId (below) tracks which row triggered it, since the
     table's rows are re-rendered from state rather than each owning
     their own persistent input. -->
<input type="file" id="completionPhotoInput" accept="image/*" style="display:none;">

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { requireAuth, renderHeader, getParam, escapeHtml, formatDate, showError, clearError, uploadImage, todayISO, comparePlotNumbers, SNAG_PRIORITIES, SNAG_PRIORITY_LABEL, SNAG_PRIORITY_BADGE, SNAG_STATUS_LABEL, SNAG_STATUS_BADGE, categoriseSnag, assignSnag, verifySnag, unverifySnag, completeSnagWithPhoto, closeSnagWithEvidence, submitSnagForReview, approveSnagReview, rejectSnagReview, getSnagPhotos, addSnagPhoto, deleteSnagPhoto, getSnagCompletionPhotoCounts, createActionFromSnag, ACTION_STATUS_LABEL, ACTION_STATUS_BADGE, saveFileToDevice, deviceSavePhotoFilename, deviceSaveStatusLabel } from "./js/app.js";

  await requireAuth();
  const listId = getParam("id");
  if (!listId) window.location.href = "dashboard.html";

  document.getElementById("viewLink").href = `snag-list-view.html?id=${listId}`;

  let snagList = null;
  let allSnags = [];
  let photoUrl = null;
  // The original, uncompressed File from the input — kept only for the
  // lifetime of this add/edit session (never persisted, never re-read
  // from a saved snag) so "Save to Device" can offer the real camera
  // original, independent of the compressed copy uploadImage() already
  // sent to Supabase above. A photo loaded from an existing snag (no
  // File object survives a page reload) simply has no Save to Device
  // control — an honest limitation, not a bug.
  let originalPhotoFile = null;
  let deviceSaveStatus = null;
  let isGeneralList = false;
  let plotsById = {};
  let members = []; // { user_id, email, role } — every project member is a legitimate snag assignee
  let actionsById = {}; // linked actions.id -> {status, due_date} for the badge, keyed once per load
  let myRole = null; // owner/collaborator/snagging — verification is editor-only
  let completionPhotoCounts = {}; // snag id -> number of completion-kind snag_photos, bulk-loaded once per list load
  let extraPhotos = { problem: [], completion: [] }; // the CURRENTLY-EDITED snag's snag_photos rows, split by kind
  let selectedIds = new Set(); // bulk-assign selection, cleared on every load/assign

  const errorBox = document.getElementById("errorBox");
  const snagCard = document.getElementById("snagCard");
  const snagForm = document.getElementById("snagForm");
  const photoGrid = document.getElementById("photoGrid");
  const photoInput = document.getElementById("photoInput");
  const prioritySelect = document.getElementById("priority");
  const assignedToSelect = document.getElementById("assignedTo");

  prioritySelect.innerHTML = SNAG_PRIORITIES.map((p) => `<option value="${p}">${SNAG_PRIORITY_LABEL[p]}</option>`).join("");

  // Renders the current photo thumbnail plus, only when this session
  // still has the original File in memory (i.e. it was just uploaded,
  // not loaded back from a saved snag), a "Save to Device" control for
  // it. Re-run after every state change instead of patching the DOM in
  // place, matching this page's existing render-from-state pattern.
  function renderPhotoGrid() {
    if (!photoUrl) { photoGrid.innerHTML = ""; return; }
    const saveHtml = originalPhotoFile ? `
      <div style="margin-top:0.4rem;">
        <button type="button" class="btn btn-outline btn-sm" id="savePhotoDeviceBtn" ${deviceSaveStatus === "saving" ? "disabled" : ""}>Save to Device</button>
        <span class="hint" id="savePhotoDeviceStatus">${escapeHtml(deviceSaveStatusLabel(deviceSaveStatus))}</span>
      </div>` : "";
    photoGrid.innerHTML = `<div class="photo-thumb"><img src="${photoUrl}"></div>${saveHtml}`;
    if (originalPhotoFile) {
      document.getElementById("savePhotoDeviceBtn").addEventListener("click", async () => {
        deviceSaveStatus = "saving";
        renderPhotoGrid();
        const result = await saveFileToDevice(originalPhotoFile, deviceSavePhotoFilename(originalPhotoFile));
        deviceSaveStatus = result.status;
        renderPhotoGrid();
      });
    }
  }

  // v52: renders the "Additional Photos" or "Completion Evidence"
  // gallery from in-memory state (extraPhotos[kind]) — each thumbnail
  // gets its own remove button, calling deleteSnagPhoto() then
  // refreshing this one grid only (the other kind's grid, and the main
  // photoGrid, are untouched).
  function renderExtraPhotoGrid(kind) {
    const grid = document.getElementById(kind === "problem" ? "problemPhotoGrid" : "completionEvidenceGrid");
    grid.innerHTML = extraPhotos[kind].map((p) => `
      <div class="photo-thumb" style="position:relative;">
        <img src="${p.photo_url}">
        <button type="button" class="btn btn-danger btn-sm" style="position:absolute; top:2px; right:2px;" onclick="removeExtraPhoto('${p.id}', '${kind}')">×</button>
      </div>
    `).join("");
  }

  async function removeExtraPhoto(photoId, kind) {
    if (!confirm("Remove this photo?")) return;
    try {
      await deleteSnagPhoto(photoId);
      extraPhotos[kind] = extraPhotos[kind].filter((p) => p.id !== photoId);
      renderExtraPhotoGrid(kind);
      if (kind === "completion") loadSnags(); // the row's attached-photo count may now need updating
    } catch (err) {
      alert("Couldn't remove that photo: " + err.message);
    }
  }
  window.removeExtraPhoto = removeExtraPhoto;

  function openForAdd() {
    snagForm.reset();
    document.getElementById("editingId").value = "";
    if (isGeneralList) document.getElementById("itemPlot").value = "";
    prioritySelect.value = "medium";
    assignedToSelect.value = "";
    photoUrl = null;
    originalPhotoFile = null;
    deviceSaveStatus = null;
    renderPhotoGrid();
    // A snag has to exist (a real id) before snag_photos rows can
    // reference it — additional photos are only manageable once saved.
    document.getElementById("extraPhotosWrap").style.display = "none";
    extraPhotos = { problem: [], completion: [] };
    document.getElementById("saveBtn").textContent = "Add Item";
    snagCard.style.display = "block";
  }
  async function openForEdit(s) {
    document.getElementById("editingId").value = s.id;
    if (isGeneralList) document.getElementById("itemPlot").value = s.plot_id || "";
    document.getElementById("location").value = s.location || "";
    document.getElementById("trade").value = s.trade || "";
    document.getElementById("description").value = s.description || "";
    prioritySelect.value = s.priority || "medium";
    document.getElementById("dueDate").value = s.due_date || "";
    assignedToSelect.value = s.assigned_to || "";
    photoUrl = s.photo_url || null;
    // A photo already saved on a snag has no surviving File object from
    // this (or any prior) session — Save to Device is only ever offered
    // for a photo just uploaded in the current add/edit interaction.
    originalPhotoFile = null;
    deviceSaveStatus = null;
    renderPhotoGrid();
    document.getElementById("extraPhotosWrap").style.display = "block";
    try {
      const photos = await getSnagPhotos(s.id);
      extraPhotos = { problem: photos.filter((p) => p.kind === "problem"), completion: photos.filter((p) => p.kind === "completion") };
    } catch (err) {
      extraPhotos = { problem: [], completion: [] };
      showError(errorBox, err);
    }
    renderExtraPhotoGrid("problem");
    renderExtraPhotoGrid("completion");
    document.getElementById("saveBtn").textContent = "Save Changes";
    snagCard.style.display = "block";
  }
  window.editSnag = (id) => { const s = allSnags.find(x => x.id === id); if (s) openForEdit(s); };

  function makeExtraPhotoHandler(inputId, kind) {
    const input = document.getElementById(inputId);
    input.addEventListener("change", async () => {
      const file = input.files[0];
      const editingId = document.getElementById("editingId").value;
      if (!file || !editingId) return;
      input.disabled = true;
      try {
        const url = await uploadImage(file, `${snagList.project_id}/snags`);
        const photo = await addSnagPhoto(editingId, url, kind);
        extraPhotos[kind] = [...extraPhotos[kind], photo];
        renderExtraPhotoGrid(kind);
        if (kind === "completion") loadSnags(); // keep the row's attached-photo count in sync
      } catch (err) {
        alert("Couldn't add that photo: " + err.message);
      } finally {
        input.disabled = false;
        input.value = "";
      }
    });
  }
  makeExtraPhotoHandler("problemPhotoInput", "problem");
  makeExtraPhotoHandler("completionEvidenceInput", "completion");

  document.getElementById("newSnagBtn").addEventListener("click", openForAdd);
  document.getElementById("cancelBtn").addEventListener("click", () => { snagCard.style.display = "none"; });

  document.getElementById("deleteListBtn").addEventListener("click", async () => {
    if (!confirm(`Delete "${snagList.title}" and all its snag items? This cannot be undone.`)) return;
    const { error } = await supabase.from("snag_lists").delete().eq("id", listId);
    if (error) { showError(errorBox, error); return; }
    window.location.href = `snagging.html?project=${snagList.project_id}`;
  });

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    if (!file) return;
    photoInput.disabled = true;
    try {
      // The existing compress-then-upload pipeline is untouched — file
      // goes into uploadImage() exactly as before. `file` itself (the
      // original, uncompressed capture) is kept separately below only
      // so Save to Device can offer it later; it is never uploaded a
      // second time and never sent anywhere else.
      photoUrl = await uploadImage(file, `${snagList.project_id}/snags`);
      originalPhotoFile = file;
      deviceSaveStatus = null;
      renderPhotoGrid();
    } catch (err) {
      showError(errorBox, err);
    } finally {
      photoInput.disabled = false;
    }
  });

  snagForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errorBox);
    const editingId = document.getElementById("editingId").value;
    const payload = {
      location: document.getElementById("location").value.trim(),
      trade: document.getElementById("trade").value.trim() || null,
      description: document.getElementById("description").value.trim(),
      photo_url: photoUrl,
      priority: prioritySelect.value,
      due_date: document.getElementById("dueDate").value || null,
      assigned_to: assignedToSelect.value || null,
    };
    if (isGeneralList) payload.plot_id = document.getElementById("itemPlot").value || null;
    try {
      if (editingId) {
        const { error } = await supabase.from("snag_items").update(payload).eq("id", editingId);
        if (error) throw error;
      } else {
        const { data: { user } } = await supabase.auth.getUser();
        payload.project_id = snagList.project_id;
        payload.snag_list_id = listId;
        payload.raised_date = todayISO();
        payload.created_by = user.id;
        const { error } = await supabase.from("snag_items").insert(payload);
        if (error) throw error;
      }
      snagCard.style.display = "none";
      loadSnags();
    } catch (err) {
      showError(errorBox, err);
    }
  });

  // v52: raw status changes the database still allows unrestricted
  // (reopening from closed/rejected, or marking Not Applicable) — the
  // gated "close a snag" paths (photo / submit-for-review / approve /
  // reject) each have their own explicit handler below instead, since
  // a plain status dropdown can no longer express them (closing
  // directly needs a photo attached in the same write).
  async function setStatus(id, newStatus) {
    const { error } = await supabase.from("snag_items").update({ status: newStatus }).eq("id", id);
    if (error) alert("Couldn't save that status change: " + error.message);
    loadSnags();
  }
  window.setStatus = setStatus;

  let completingSnagId = null;
  const completionPhotoInput = document.getElementById("completionPhotoInput");

  function startCompleteWithPhoto(id) {
    completingSnagId = id;
    completionPhotoInput.value = "";
    completionPhotoInput.click();
  }
  window.startCompleteWithPhoto = startCompleteWithPhoto;

  completionPhotoInput.addEventListener("change", async () => {
    const file = completionPhotoInput.files[0];
    const id = completingSnagId;
    if (!file || !id) return;
    completionPhotoInput.disabled = true;
    try {
      const url = await uploadImage(file, `${snagList.project_id}/snags`);
      await completeSnagWithPhoto(id, url);
      loadSnags();
    } catch (err) {
      alert("Couldn't complete that snag: " + err.message);
    } finally {
      completionPhotoInput.disabled = false;
      completingSnagId = null;
    }
  });

  // v52: closes a snag whose completion evidence was already attached
  // via the Edit form's "Completion Evidence" gallery (one or more
  // photos, added ahead of time) — no upload here, the server just
  // checks those already-attached photos exist.
  async function markComplete(id) {
    try {
      await closeSnagWithEvidence(id);
      loadSnags();
    } catch (err) {
      alert("Couldn't complete that snag: " + err.message);
    }
  }
  window.markComplete = markComplete;

  async function submitForReview(id) {
    if (!confirm("Submit this snag for review with no photo? A project editor will need to approve or reject it before it counts as closed.")) return;
    try {
      await submitSnagForReview(id);
      loadSnags();
    } catch (err) {
      alert("Couldn't submit that snag for review: " + err.message);
    }
  }
  window.submitForReview = submitForReview;

  async function approveReview(id) {
    try {
      await approveSnagReview(id);
      loadSnags();
    } catch (err) {
      alert("Couldn't approve that snag: " + err.message);
    }
  }
  window.approveReview = approveReview;

  async function rejectReview(id) {
    const note = prompt("Why is this being sent back? (the assignee will see this)", "");
    if (note === null) return;
    try {
      await rejectSnagReview(id, note.trim() || null);
      loadSnags();
    } catch (err) {
      alert("Couldn't reject that snag: " + err.message);
    }
  }
  window.rejectReview = rejectReview;

  async function quickAssign(id, userId) {
    try { await assignSnag(id, userId || null); loadSnags(); }
    catch (err) { alert("Couldn't save that assignment: " + err.message); }
  }
  window.quickAssign = quickAssign;

  // Bulk assign — the same server-validated assignSnag() call quickAssign()
  // already uses (assignee must be a real project member, enforced by
  // snag_items_before_write() regardless of how many calls are made), just
  // looped over a selection instead of one row at a time.
  function updateBulkBar() {
    const bar = document.getElementById("bulkBar");
    const selectAll = document.getElementById("selectAllCheckbox");
    if (selectedIds.size === 0) {
      bar.style.display = "none";
    } else {
      bar.style.display = "block";
      document.getElementById("bulkCount").textContent = `${selectedIds.size} selected`;
    }
    if (selectAll) {
      selectAll.checked = allSnags.length > 0 && selectedIds.size === allSnags.length;
      selectAll.indeterminate = selectedIds.size > 0 && selectedIds.size < allSnags.length;
    }
  }

  function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    updateBulkBar();
  }
  window.toggleSelect = toggleSelect;

  function toggleSelectAll(checked) {
    selectedIds = new Set(checked ? allSnags.map((s) => s.id) : []);
    render();
  }
  window.toggleSelectAll = toggleSelectAll;

  document.getElementById("bulkClearBtn").addEventListener("click", () => {
    selectedIds = new Set();
    render();
  });

  document.getElementById("bulkAssignBtn").addEventListener("click", async () => {
    const userId = document.getElementById("bulkAssignSelect").value || null;
    const ids = [...selectedIds];
    if (!ids.length) return;
    const results = await Promise.allSettled(ids.map((id) => assignSnag(id, userId)));
    const failed = results.filter((r) => r.status === "rejected").length;
    selectedIds = new Set();
    await loadSnags();
    if (failed > 0) {
      alert(`${failed} of ${ids.length} snag(s) couldn't be reassigned: ${results.find((r) => r.status === "rejected").reason?.message || ""}`);
    }
  });

  async function toggleVerify(id, currentlyVerified) {
    try {
      if (currentlyVerified) await unverifySnag(id);
      else await verifySnag(id);
      loadSnags();
    } catch (err) {
      alert("Couldn't save that verification change: " + err.message);
    }
  }
  window.toggleVerify = toggleVerify;

  async function quickCreateAction(id) {
    const s = allSnags.find((x) => x.id === id);
    if (!s) return;
    const title = prompt("Action title:", `Fix: ${s.location}`);
    if (!title || !title.trim()) return;
    try {
      await createActionFromSnag(s, { title: title.trim(), priority: s.priority || "medium", assignedTo: null, dueDate: s.due_date || null });
      loadSnags();
    } catch (err) {
      alert("Couldn't create that action: " + err.message);
    }
  }
  window.quickCreateAction = quickCreateAction;

  async function toggleDelayFlag(id, currentlyFlagged) {
    let error;
    if (currentlyFlagged) {
      if (!confirm("Clear the delay flag on this snag?")) return;
      ({ error } = await supabase.from("snag_items").update({ delay_flag: false, delay_reason: null }).eq("id", id));
    } else {
      const reason = prompt('What\'s delaying this snag? (e.g. "waiting on parts", "access blocked")', "");
      if (reason === null) return;
      ({ error } = await supabase.from("snag_items").update({ delay_flag: true, delay_reason: reason.trim() || null }).eq("id", id));
    }
    if (error) alert("Couldn't save that change: " + error.message);
    loadSnags();
  }
  window.toggleDelayFlag = toggleDelayFlag;

  async function deleteSnag(id) {
    if (!confirm("Delete this snag item?")) return;
    await supabase.from("snag_items").delete().eq("id", id);
    loadSnags();
  }
  window.deleteSnag = deleteSnag;

  function memberEmail(userId) {
    return members.find((m) => m.user_id === userId)?.email || "—";
  }

  const isEditor = () => myRole === "owner" || myRole === "collaborator";

  // v52: the status cell's action set, entirely driven by the snag's
  // own current status — the database (snag_items_before_write()) is
  // still the real authority for every one of these; this only decides
  // which buttons make sense to offer right now.
  function statusCellHtml(s) {
    const verified = !!s.verified_at;
    const badge = `<span class="badge ${SNAG_STATUS_BADGE[s.status]}">${SNAG_STATUS_LABEL[s.status]}</span>`;
    let actions = "";
    if (s.status === "open") {
      // v52: "add more" — evidence can be attached ahead of time via
      // Edit's Completion Evidence gallery (repeatable), in which case
      // Mark Complete just closes with what's already attached; with
      // nothing attached yet, 📷 Complete stays the fast single-photo
      // upload-and-close shortcut.
      const photoCount = completionPhotoCounts[s.id] || 0;
      actions = `
        <div class="btn-row" style="margin-top:0.3rem;">
          ${photoCount > 0
            ? `<button type="button" class="btn btn-outline btn-sm" onclick="markComplete('${s.id}')">Mark Complete</button>`
            : `<button type="button" class="btn btn-outline btn-sm" onclick="startCompleteWithPhoto('${s.id}')">📷 Complete</button>`}
          <button type="button" class="btn btn-outline btn-sm" onclick="submitForReview('${s.id}')">Submit for Review</button>
        </div>
        ${photoCount > 0 ? `<div class="hint" style="margin-top:0.3rem;">${photoCount} evidence photo${photoCount > 1 ? "s" : ""} attached (Edit to add more)</div>` : ""}
        ${s.review_note ? `<div class="hint" style="margin-top:0.3rem;">Sent back: ${escapeHtml(s.review_note)}</div>` : ""}
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:0.3rem;" onclick="setStatus('${s.id}', 'rejected')">Not Applicable</button>
      `;
    } else if (s.status === "pending_review") {
      actions = isEditor()
        ? `<div class="btn-row" style="margin-top:0.3rem;">
             <button type="button" class="btn btn-outline btn-sm" onclick="approveReview('${s.id}')">Approve</button>
             <button type="button" class="btn btn-outline btn-sm" onclick="rejectReview('${s.id}')">Reject</button>
           </div>`
        : `<div class="hint" style="margin-top:0.3rem;">Awaiting editor review</div>`;
    } else if (s.status === "closed") {
      const photoCount = completionPhotoCounts[s.id] || 0;
      actions = `
        <div class="badge ${verified ? "badge-green" : "badge-grey"}" style="margin-top:0.3rem;">${verified ? "✔ Verified" : "Not verified"}</div>
        ${photoCount > 0 ? `<div class="hint" style="margin-top:0.3rem;">📷 ${photoCount} evidence photo${photoCount > 1 ? "s" : ""} (Edit to view)</div>` : ""}
        ${isEditor() ? `<button type="button" class="btn btn-outline btn-sm" style="margin-top:0.3rem;" onclick="toggleVerify('${s.id}', ${verified})">${verified ? "Unverify" : "Verify"}</button>` : ""}
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:0.3rem;" onclick="setStatus('${s.id}', 'open')">Reopen</button>
      `;
    } else if (s.status === "rejected") {
      actions = `<button type="button" class="btn btn-outline btn-sm" style="margin-top:0.3rem;" onclick="setStatus('${s.id}', 'open')">Reopen</button>`;
    }
    return `${badge}${actions}`;
  }

  function render() {
    const selectAllTh = `<th><input type="checkbox" id="selectAllCheckbox" title="Select all" onchange="toggleSelectAll(this.checked)"></th>`;
    if (isGeneralList) {
      document.getElementById("tableHead").innerHTML = `<tr>${selectAllTh}<th>#</th><th>Plot</th><th>Location</th><th>Description</th><th>Trade</th><th>Priority</th><th>Assigned</th><th>Due</th><th>Status</th><th></th></tr>`;
    } else {
      document.getElementById("tableHead").innerHTML = `<tr>${selectAllTh}<th>#</th><th>Location</th><th>Description</th><th>Trade</th><th>Priority</th><th>Assigned</th><th>Due</th><th>Status</th><th></th></tr>`;
    }
    document.getElementById("emptyState").style.display = allSnags.length ? "none" : "block";
    document.getElementById("snagRows").innerHTML = allSnags.map((s) => {
      const cats = categoriseSnag(s);
      const dueBadge = cats.overdue ? '<span class="badge badge-red" style="margin-left:0.4rem;">Overdue</span>'
        : cats.dueToday ? '<span class="badge badge-amber" style="margin-left:0.4rem;">Due today</span>'
        : cats.dueSoon ? '<span class="badge badge-amber" style="margin-left:0.4rem;">Due soon</span>' : "";
      const actionBadge = s.action_id
        ? ` <a href="actions.html?project=${snagList.project_id}" class="badge ${ACTION_STATUS_BADGE[actionsById[s.action_id]?.status] || "badge-grey"}" title="Linked Action">📌 Action${actionsById[s.action_id] ? `: ${ACTION_STATUS_LABEL[actionsById[s.action_id].status]}` : ""}</a>`
        : "";
      const findingBadge = s.inspection_findings?.inspection_id
        ? ` <a href="inspection-detail.html?id=${s.inspection_findings.inspection_id}" class="badge badge-grey" title="Raised from an inspection finding">🔍 From Finding</a>`
        : "";
      return `
      <tr>
        <td><input type="checkbox" ${selectedIds.has(s.id) ? "checked" : ""} onchange="toggleSelect('${s.id}', this.checked)"></td>
        <td>${s.item_no}</td>
        ${isGeneralList ? `<td>${s.plot_id ? escapeHtml(plotsById[s.plot_id] || "—") : "External / Site-wide"}</td>` : ""}
        <td>${escapeHtml(s.location)}</td>
        <td>${escapeHtml(s.description)}${s.photo_url ? ' <span title="Has photo">📷</span>' : ""}${findingBadge}</td>
        <td>${escapeHtml(s.trade) || "—"}</td>
        <td><span class="badge ${SNAG_PRIORITY_BADGE[s.priority] || "badge-grey"}">${SNAG_PRIORITY_LABEL[s.priority] || s.priority}</span></td>
        <td>
          <select style="width:auto;" onchange="quickAssign('${s.id}', this.value)">
            <option value="">Unassigned</option>
            ${members.map((m) => `<option value="${m.user_id}" ${s.assigned_to === m.user_id ? "selected" : ""}>${escapeHtml(m.email)}</option>`).join("")}
          </select>
        </td>
        <td>${s.due_date ? formatDate(s.due_date) : "—"}${dueBadge}</td>
        <td>
          ${statusCellHtml(s)}
          ${s.delay_flag ? `<div class="badge badge-amber" style="margin-top:0.3rem; white-space:normal;" title="Flagged as delaying completion">⚠️ Delayed${s.delay_reason ? `: ${escapeHtml(s.delay_reason)}` : ""}</div>` : ""}
          ${actionBadge}
        </td>
        <td class="btn-row">
          <button class="btn btn-outline btn-sm" onclick="editSnag('${s.id}')">Edit</button>
          ${!s.action_id ? `<button class="btn btn-outline btn-sm" onclick="quickCreateAction('${s.id}')">Create Action</button>` : ""}
          <button class="btn btn-outline btn-sm" onclick="toggleDelayFlag('${s.id}', ${s.delay_flag})">${s.delay_flag ? "Clear Flag" : "Flag Delay"}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSnag('${s.id}')">Delete</button>
        </td>
      </tr>
    `;
    }).join("");
    updateBulkBar();
  }

  async function loadSnags() {
    const { data, error } = await supabase
      .from("snag_items")
      .select("*, inspection_findings(inspection_id)")
      .eq("snag_list_id", listId)
      .order("item_no", { ascending: true });
    if (!error) allSnags = data || [];
    // A snag selected for bulk-assign that's since been deleted (by this
    // page or elsewhere) must not silently inflate the selection count —
    // its checkbox can no longer even render for the user to un-tick it.
    const stillExisting = new Set(allSnags.map((s) => s.id));
    selectedIds = new Set([...selectedIds].filter((id) => stillExisting.has(id)));
    const actionIds = allSnags.map((s) => s.action_id).filter(Boolean);
    if (actionIds.length) {
      const { data: linkedActions } = await supabase.from("actions").select("id, status, due_date").in("id", actionIds);
      actionsById = {};
      (linkedActions || []).forEach((a) => { actionsById[a.id] = a; });
    } else {
      actionsById = {};
    }
    try {
      completionPhotoCounts = await getSnagCompletionPhotoCounts(allSnags.map((s) => s.id));
    } catch {
      completionPhotoCounts = {}; // best-effort — a failed count lookup just falls back to the single-photo quick-close path
    }
    render();
  }

  async function init() {
    const { data: list, error } = await supabase.from("snag_lists").select("*, projects(*), plots(*)").eq("id", listId).single();
    if (error) { document.getElementById("listTitle").textContent = "Snag list not found"; return; }
    snagList = list;
    isGeneralList = !snagList.plot_id;
    const project = list.projects;
    const plotLabel = list.plots ? `${list.plots.plot_number} – Snag List` : list.title;

    document.getElementById("listTitle").textContent = plotLabel;
    document.getElementById("projectSub").textContent = project.name;
    renderHeader([
      { label: "Dashboard", href: "dashboard.html" },
      { label: project.name, href: `project.html?id=${project.id}` },
      { label: "Snagging", href: `snagging.html?project=${project.id}` },
      { label: plotLabel },
    ]);

    if (isGeneralList) {
      const { data: plots } = await supabase
        .from("plots")
        .select("id, plot_number")
        .eq("project_id", snagList.project_id);
      const sorted = (plots || []).slice().sort((a, b) => comparePlotNumbers(a.plot_number, b.plot_number));
      sorted.forEach((p) => { plotsById[p.id] = p.plot_number; });
      const itemPlot = document.getElementById("itemPlot");
      sorted.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.plot_number;
        itemPlot.appendChild(opt);
      });
      document.getElementById("plotFieldWrap").style.display = "block";
      document.getElementById("deleteListBtn").style.display = "inline-block";
    }

    const [{ data: memberRows }, { data: role }] = await Promise.all([
      supabase.rpc("get_project_members", { p_project_id: snagList.project_id }),
      supabase.rpc("get_my_role", { p_project_id: snagList.project_id }),
    ]);
    members = memberRows || [];
    myRole = role;
    assignedToSelect.innerHTML = `<option value="">Unassigned</option>` +
      members.map((m) => `<option value="${m.user_id}">${escapeHtml(m.email)}</option>`).join("");
    document.getElementById("bulkAssignSelect").innerHTML = `<option value="">Unassigned</option>` +
      members.map((m) => `<option value="${m.user_id}">${escapeHtml(m.email)}</option>`).join("");

    loadSnags();
  }

  init();
</script>
</body>
</html>
