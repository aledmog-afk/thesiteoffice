<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snagging – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="site-header"></div>

<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Snagging</div>
      <div class="page-sub" id="projectSub"></div>
    </div>
    <div class="btn-row">
      <a class="btn btn-outline" id="exportLink" href="#" target="_blank">Export Sheet</a>
      <button class="btn btn-amber" id="newSnagBtn">+ Add Snag</button>
    </div>
  </div>

  <div class="card" id="newSnagCard" style="display:none;">
    <div id="errorBox" class="error-box"></div>
    <form id="snagForm">
      <div class="form-grid">
        <div class="field"><label for="location">Location / Plot *</label><input type="text" id="location" required placeholder="e.g. Plot 14, First floor bathroom"></div>
        <div class="field"><label for="trade">Trade responsible</label><input type="text" id="trade" placeholder="e.g. Plumbing"></div>
      </div>
      <div class="field"><label for="description">Description *</label><textarea id="description" rows="2" required placeholder="What's wrong and where exactly"></textarea></div>
      <div class="form-grid">
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field"><label for="raisedBy">Raised by</label><input type="text" id="raisedBy" placeholder="Your name"></div>
      </div>
      <div class="field">
        <label>Photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <div class="photo-grid" id="photoGrid"></div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn-amber">Add Snag</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <div class="filter-bar">
    <select id="statusFilter">
      <option value="open" selected>Open only</option>
      <option value="closed">Closed only</option>
      <option value="all">All</option>
    </select>
    <select id="priorityFilter">
      <option value="all">All priorities</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Location</th><th>Description</th><th>Trade</th><th>Priority</th><th>Status</th><th>Raised</th><th></th></tr>
        </thead>
        <tbody id="snagRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty" style="display:none;"><p>No snags match this filter.</p></div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { requireAuth, renderHeader, getParam, escapeHtml, formatDate, showError, clearError, uploadPhoto, todayISO } from "./js/app.js";

  await requireAuth();
  const projectId = getParam("project");
  if (!projectId) window.location.href = "dashboard.html";

  const priorityBadge = { high: "badge-red", medium: "badge-amber", low: "badge-grey" };
  let allSnags = [];
  let photoUrl = null;

  const errorBox = document.getElementById("errorBox");
  const newSnagCard = document.getElementById("newSnagCard");
  const photoGrid = document.getElementById("photoGrid");
  const photoInput = document.getElementById("photoInput");

  document.getElementById("newSnagBtn").addEventListener("click", () => newSnagCard.style.display = "block");
  document.getElementById("cancelBtn").addEventListener("click", () => {
    newSnagCard.style.display = "none";
    document.getElementById("snagForm").reset();
    photoUrl = null;
    photoGrid.innerHTML = "";
  });

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    if (!file) return;
    photoInput.disabled = true;
    try {
      photoUrl = await uploadPhoto(file, `${projectId}/snags`);
      photoGrid.innerHTML = `<div class="photo-thumb"><img src="${photoUrl}"></div>`;
    } catch (err) {
      showError(errorBox, err);
    } finally {
      photoInput.disabled = false;
    }
  });

  document.getElementById("snagForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(errorBox);
    const { data: { user } } = await supabase.auth.getUser();
    const payload = {
      project_id: projectId,
      location: document.getElementById("location").value.trim(),
      trade: document.getElementById("trade").value.trim() || null,
      description: document.getElementById("description").value.trim(),
      priority: document.getElementById("priority").value,
      raised_by: document.getElementById("raisedBy").value.trim() || null,
      raised_date: todayISO(),
      photo_url: photoUrl,
      created_by: user.id,
    };
    try {
      const { error } = await supabase.from("snag_items").insert(payload);
      if (error) throw error;
      document.getElementById("cancelBtn").click();
      loadSnags();
    } catch (err) {
      showError(errorBox, err);
    }
  });

  async function toggleStatus(id, current) {
    const newStatus = current === "open" ? "closed" : "open";
    const patch = { status: newStatus, closed_date: newStatus === "closed" ? todayISO() : null };
    await supabase.from("snag_items").update(patch).eq("id", id);
    loadSnags();
  }
  window.toggleStatus = toggleStatus;

  function applyFilters() {
    const statusFilter = document.getElementById("statusFilter").value;
    const priorityFilter = document.getElementById("priorityFilter").value;
    let rows = allSnags;
    if (statusFilter !== "all") rows = rows.filter(s => s.status === statusFilter);
    if (priorityFilter !== "all") rows = rows.filter(s => s.priority === priorityFilter);

    document.getElementById("emptyState").style.display = rows.length ? "none" : "block";
    document.getElementById("snagRows").innerHTML = rows.map((s) => `
      <tr>
        <td>${s.item_no}</td>
        <td>${escapeHtml(s.location)}</td>
        <td>${escapeHtml(s.description)}${s.photo_url ? ' <span title="Has photo">📷</span>' : ""}</td>
        <td>${escapeHtml(s.trade) || "—"}</td>
        <td><span class="badge ${priorityBadge[s.priority]}">${escapeHtml(s.priority)}</span></td>
        <td><span class="badge ${s.status === "open" ? "badge-red" : "badge-green"}">${escapeHtml(s.status)}</span></td>
        <td>${formatDate(s.raised_date)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="toggleStatus('${s.id}', '${s.status}')">${s.status === "open" ? "Close" : "Reopen"}</button></td>
      </tr>
    `).join("");
  }
  document.getElementById("statusFilter").addEventListener("change", applyFilters);
  document.getElementById("priorityFilter").addEventListener("change", applyFilters);

  function updateExportLink() {
    const status = document.getElementById("statusFilter").value;
    document.getElementById("exportLink").href = `snagging-sheet-view.html?project=${projectId}&status=${status}`;
  }
  document.getElementById("statusFilter").addEventListener("change", updateExportLink);

  async function loadSnags() {
    const { data, error } = await supabase
      .from("snag_items")
      .select("*")
      .eq("project_id", projectId)
      .order("item_no", { ascending: true });
    if (!error) allSnags = data || [];
    applyFilters();
  }

  async function init() {
    const { data: project } = await supabase.from("projects").select("name").eq("id", projectId).single();
    renderHeader([
      { label: "Dashboard", href: "dashboard.html" },
      { label: project?.name || "Site", href: `project.html?id=${projectId}` },
      { label: "Snagging" },
    ]);
    document.getElementById("projectSub").textContent = project?.name || "";
    updateExportLink();
    loadSnags();
  }

  init();
</script>
</body>
</html>
