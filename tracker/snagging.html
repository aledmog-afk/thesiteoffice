<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snagging – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="site-header"></div>

<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Snagging</div>
      <div class="page-sub" id="projectSub">Start a new snag list, add items to it, then export it as a PDF.</div>
    </div>
    <button class="btn btn-amber" id="newListBtn">+ New Snag List</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>List</th><th>Open</th><th>Closed</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="listRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty" style="display:none;">
      <p>No snag lists yet for this site.</p>
      <button class="btn btn-amber" id="emptyNewBtn">+ New Snag List</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { requireAuth, renderHeader, getParam, escapeHtml, formatDate, todayISO } from "./js/app.js";

  await requireAuth();
  const projectId = getParam("project");
  if (!projectId) window.location.href = "dashboard.html";

  async function createList() {
    const defaultTitle = `Snag List – ${formatDate(todayISO())}`;
    const title = prompt("Name this snag list:", defaultTitle);
    if (title === null) return;
    const { data: { user } } = await supabase.auth.getUser();
    const { data, error } = await supabase
      .from("snag_lists")
      .insert({ project_id: projectId, title: title.trim() || defaultTitle, created_by: user.id })
      .select()
      .single();
    if (!error) window.location.href = `snag-list-edit.html?id=${data.id}`;
  }
  document.getElementById("newListBtn").addEventListener("click", createList);
  document.getElementById("emptyNewBtn")?.addEventListener("click", createList);

  async function deleteList(id, title) {
    if (!confirm(`Delete "${title}" and all its items? This cannot be undone.`)) return;
    await supabase.from("snag_lists").delete().eq("id", id);
    load();
  }
  window.deleteList = deleteList;

  async function load() {
    const { data: project } = await supabase.from("projects").select("name").eq("id", projectId).single();
    renderHeader([
      { label: "Dashboard", href: "dashboard.html" },
      { label: project?.name || "Site", href: `project.html?id=${projectId}` },
      { label: "Snagging" },
    ]);

    const { data: lists, error } = await supabase
      .from("snag_lists")
      .select("*")
      .eq("project_id", projectId)
      .order("created_at", { ascending: false });

    if (error || !lists || !lists.length) {
      document.getElementById("emptyState").style.display = "block";
      return;
    }

    const { data: items } = await supabase
      .from("snag_items")
      .select("snag_list_id, status")
      .eq("project_id", projectId);

    const counts = {};
    (items || []).forEach((it) => {
      counts[it.snag_list_id] = counts[it.snag_list_id] || { open: 0, closed: 0 };
      counts[it.snag_list_id][it.status]++;
    });

    document.getElementById("listRows").innerHTML = lists.map((l) => {
      const c = counts[l.id] || { open: 0, closed: 0 };
      return `
        <tr class="row-link" onclick="window.location.href='snag-list-edit.html?id=${l.id}'">
          <td><strong>${escapeHtml(l.title)}</strong></td>
          <td><span class="badge badge-red">${c.open}</span></td>
          <td><span class="badge badge-green">${c.closed}</span></td>
          <td>${formatDate(l.created_at?.slice(0, 10))}</td>
          <td onclick="event.stopPropagation()"><button class="btn btn-outline btn-sm" onclick="deleteList('${l.id}', '${escapeHtml(l.title).replace(/'/g, "\\'")}')">Delete</button></td>
        </tr>
      `;
    }).join("");
  }

  load();
</script>
</body>
</html>
