<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snagging – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="site-header"></div>

<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Snagging</div>
      <div class="page-sub" id="projectSub">One snag list per plot — click a plot to add items to it, then export that plot's list as a PDF.</div>
    </div>
    <button class="btn btn-amber" id="newPlotBtn">+ Plot</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Plot</th><th>Open</th><th>Closed</th><th>Added</th></tr>
        </thead>
        <tbody id="plotRows"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty" style="display:none;">
      <p>No plots yet. Add your first plot to start a snag list for it.</p>
      <button class="btn btn-amber" id="emptyNewPlotBtn">+ Plot</button>
    </div>
    <p class="hint">Plots are shared with Plot Handovers — to rename or delete a plot, use the Plot Handovers page.</p>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { requireAuth, renderHeader, getParam, escapeHtml, formatDate } from "./js/app.js";

  await requireAuth();
  const projectId = getParam("project");
  if (!projectId) window.location.href = "dashboard.html";

  async function goToPlotList(plotId) {
    const { data: list } = await supabase.from("snag_lists").select("id").eq("plot_id", plotId).single();
    if (list) window.location.href = `snag-list-edit.html?id=${list.id}`;
  }
  window.goToPlotList = goToPlotList;

  async function createPlot() {
    const plotNumber = prompt("Plot number / name:", "Plot ");
    if (!plotNumber || !plotNumber.trim()) return;
    const { data: { user } } = await supabase.auth.getUser();
    const { data: plot, error } = await supabase
      .from("plots")
      .insert({ project_id: projectId, plot_number: plotNumber.trim(), created_by: user.id })
      .select()
      .single();
    if (error) return;
    const { data: list } = await supabase.from("snag_lists").select("id").eq("plot_id", plot.id).single();
    window.location.href = `snag-list-edit.html?id=${list.id}`;
  }
  document.getElementById("newPlotBtn").addEventListener("click", createPlot);
  document.getElementById("emptyNewPlotBtn")?.addEventListener("click", createPlot);

  async function load() {
    const { data: project } = await supabase.from("projects").select("name").eq("id", projectId).single();
    renderHeader([
      { label: "Dashboard", href: "dashboard.html" },
      { label: project?.name || "Site", href: `project.html?id=${projectId}` },
      { label: "Snagging" },
    ]);

    const { data: plots, error } = await supabase
      .from("plots")
      .select("*")
      .eq("project_id", projectId)
      .order("plot_number", { ascending: true });

    if (error || !plots || !plots.length) {
      document.getElementById("emptyState").style.display = "block";
      return;
    }

    const [{ data: lists }, { data: items }] = await Promise.all([
      supabase.from("snag_lists").select("id, plot_id").eq("project_id", projectId),
      supabase.from("snag_items").select("snag_list_id, status").eq("project_id", projectId),
    ]);

    const listByPlot = {};
    (lists || []).forEach((l) => { listByPlot[l.plot_id] = l.id; });

    const counts = {};
    (items || []).forEach((it) => {
      counts[it.snag_list_id] = counts[it.snag_list_id] || { open: 0, closed: 0 };
      counts[it.snag_list_id][it.status]++;
    });

    document.getElementById("plotRows").innerHTML = plots.map((p) => {
      const listId = listByPlot[p.id];
      const c = counts[listId] || { open: 0, closed: 0 };
      return `
        <tr class="row-link" onclick="goToPlotList('${p.id}')">
          <td><strong>${escapeHtml(p.plot_number)}</strong></td>
          <td><span class="badge badge-red">${c.open}</span></td>
          <td><span class="badge badge-green">${c.closed}</span></td>
          <td>${formatDate(p.created_at?.slice(0, 10))}</td>
        </tr>
      `;
    }).join("");
  }

  load();
</script>
</body>
</html>
