<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Daywork – Site Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="site-header"></div>

<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title" id="pageTitle">New Daywork</div>
      <div class="page-sub" id="projectSub"></div>
    </div>
    <span class="badge" id="statusBadge" style="display:none;"></span>
  </div>

  <div id="pageErrorBox" class="error-box"></div>

  <div class="card" id="noAccessCard" style="display:none;">
    <p>You don't have Commercial access on this site.</p>
  </div>

  <!-- ─── CREATE MODE ─────────────────────────────────────────── -->
  <div class="card" id="createCard" style="display:none;">
    <form id="createForm">
      <div class="field"><label for="cTitle">Description *</label><input type="text" id="cTitle" required placeholder="e.g. Additional groundworks — plot 4 foundations" autofocus></div>
      <div class="form-grid">
        <div class="field"><label for="cDate">Date undertaken</label><input type="date" id="cDate"></div>
        <div class="field"><label for="cPlot">Plot / location</label><select id="cPlot"><option value="">No specific plot</option></select></div>
      </div>
      <p class="hint">Create the Daywork now, then add pricing and evidence on the next screen. The reference number is assigned automatically.</p>
      <div class="btn-row">
        <button type="submit" class="btn btn-amber" id="createBtn">Create Daywork</button>
        <button type="button" class="btn btn-outline" id="cancelCreateBtn">Cancel</button>
      </div>
    </form>
  </div>

  <!-- ─── DETAIL MODE ─────────────────────────────────────────── -->
  <div id="detailBody" style="display:none;">
    <div class="card" id="headerCard" style="margin-bottom:1.5rem;">
      <dl class="doc-facts" id="headerFacts"></dl>
      <form id="editHeaderForm" style="display:none; margin-top:1rem;">
        <div class="field"><label for="eTitle">Description *</label><input type="text" id="eTitle" required></div>
        <div class="form-grid">
          <div class="field"><label for="eDate">Date undertaken</label><input type="date" id="eDate"></div>
          <div class="field"><label for="ePlot">Plot / location</label><select id="ePlot"><option value="">No specific plot</option></select></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-amber btn-sm">Save Changes</button>
          <button type="button" class="btn btn-outline btn-sm" id="cancelEditHeaderBtn">Cancel</button>
        </div>
      </form>
      <div class="btn-row" style="margin-top:0.8rem;">
        <button type="button" class="btn btn-outline btn-sm" id="editHeaderBtn" style="display:none;">Edit Details</button>
      </div>
    </div>

    <div class="card" id="pricingCard" style="margin-bottom:1.5rem;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
        <h3 style="font-family:var(--font-display); font-size:1rem; margin:0;">Pricing</h3>
        <strong id="grandTotal" style="font-family:var(--font-display); font-size:1.2rem;">£0.00</strong>
      </div>
      <div id="tbcWarning" class="hint" style="display:none; color:var(--amber); margin-bottom:0.8rem;"></div>
      <ul class="item-list" id="lineItemList"></ul>
      <div class="item-add-row" id="lineItemAddRow" style="display:none; flex-wrap:wrap; margin-top:0.8rem;">
        <select id="liType" style="flex:0 0 140px;"></select>
        <input type="text" id="liDescription" placeholder="Description" style="flex:1 1 220px;">
        <input type="text" id="liTrade" placeholder="Trade (optional)" style="flex:0 0 140px;">
        <input type="number" id="liQuantity" placeholder="Qty" value="1" min="0" step="0.01" inputmode="decimal" style="flex:0 0 90px;">
        <input type="text" id="liUnit" placeholder="Unit" style="flex:0 0 90px;">
        <input type="number" id="liRate" placeholder="Rate £ (blank = TBC)" step="0.0001" inputmode="decimal" style="flex:0 0 160px;">
        <span class="hint" id="liPreview" style="flex:0 0 auto; align-self:center;"></span>
        <button type="button" class="btn btn-outline btn-sm" id="addLineItemBtn">+ Add Line</button>
      </div>
    </div>

    <div class="card" id="evidenceCard" style="margin-bottom:1.5rem;">
      <h3 style="font-family:var(--font-display); font-size:1rem; margin-bottom:1rem;">Evidence</h3>
      <div id="evidenceGrid"></div>
      <div id="evidenceEmpty" class="hint" style="display:none;">No evidence attached yet.</div>
      <div class="btn-row" id="addEvidenceRow" style="margin-top:0.8rem; display:none;">
        <label class="btn btn-outline btn-sm" style="cursor:pointer;">📷 Add Photo
          <input type="file" accept="image/*" style="display:none;" id="evidenceFileInput">
        </label>
      </div>
    </div>

    <div class="card" id="workflowCard">
      <h3 style="font-family:var(--font-display); font-size:1rem; margin-bottom:1rem;">Status &amp; Approval</h3>
      <div id="workflowDetails" style="margin-bottom:1rem;"></div>
      <div class="btn-row" id="workflowActions"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="rejectModal" style="display:none;">
  <div class="modal-box">
    <h3 style="font-family:var(--font-display); margin-top:0;">Reject this Daywork</h3>
    <div class="field"><label for="rejectReason">Reason (optional, visible to the person who submitted it)</label><textarea id="rejectReason" rows="3"></textarea></div>
    <div class="btn-row">
      <button type="button" class="btn btn-danger" id="confirmRejectBtn">Reject</button>
      <button type="button" class="btn btn-outline" id="cancelRejectBtn">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./js/supabase-client.js";
  import { requireAuth, renderHeader, getParam, escapeHtml, formatDate, showCommercialError, clearError, getMyCommercialRole, commercialCapabilities, createDaywork, getDaywork, updateDaywork, getCommercialLineItems, addCommercialLineItem, deleteCommercialLineItem, getCommercialEvidence, addCommercialEvidencePhoto, removeCommercialEvidenceLink, getCommercialSignatures, submitCommercialEvent, approveCommercialEvent, rejectCommercialEvent, reopenCommercialEvent, validCommercialStatusTransitions, previewLineTotal, formatCommercialGBP, getMemberEmailMap, getDocumentFileUrl, todayISO, comparePlotNumbers, COMMERCIAL_STATUS_LABEL, COMMERCIAL_STATUS_BADGE, COMMERCIAL_LINE_TYPES, COMMERCIAL_LINE_TYPE_LABEL } from "./js/app.js";

  await requireAuth();
  const eventId = getParam("id");
  let projectId = getParam("project"); // present in create mode; resolved from the record itself in detail mode

  const pageErrorBox = document.getElementById("pageErrorBox");
  let caps = commercialCapabilities(null);
  let plots = [];
  let event = null;
  let lineItems = [];
  let evidence = [];
  let signatures = [];
  let membersById = {};
  let currentUserId = null;

  function plotOptionsHtml(selectedId) {
    return `<option value="">No specific plot</option>` +
      plots.map((p) => `<option value="${p.id}" ${p.id === selectedId ? "selected" : ""}>${escapeHtml(p.plot_number)}</option>`).join("");
  }

  // ─── CREATE MODE ────────────────────────────────────────────────
  async function initCreateMode() {
    if (!projectId) { window.location.href = "dashboard.html"; return; }
    const role = await getMyCommercialRole(projectId).catch(() => null);
    caps = commercialCapabilities(role);
    if (!caps.canView) { document.getElementById("noAccessCard").style.display = "block"; return; }
    if (!caps.canEdit) {
      showCommercialError(pageErrorBox, { message: "You have view-only Commercial access — only a Contributor or Approver can create a Daywork." });
      return;
    }
    const { data: plotRows } = await supabase.from("plots").select("id, plot_number").eq("project_id", projectId);
    plots = (plotRows || []).slice().sort((a, b) => comparePlotNumbers(a.plot_number, b.plot_number));
    document.getElementById("cPlot").innerHTML = plotOptionsHtml(null);
    document.getElementById("cDate").value = todayISO();
    document.getElementById("createCard").style.display = "block";
  }

  document.getElementById("cancelCreateBtn").addEventListener("click", () => {
    window.location.href = `dayworks.html?project=${projectId}`;
  });

  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(pageErrorBox);
    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    try {
      const created = await createDaywork(projectId, {
        title: document.getElementById("cTitle").value.trim(),
        dateUndertaken: document.getElementById("cDate").value || null,
        plotId: document.getElementById("cPlot").value || null,
      });
      window.location.href = `daywork-detail.html?id=${created.id}`;
    } catch (err) {
      showCommercialError(pageErrorBox, err);
      btn.disabled = false;
    }
  });

  // ─── DETAIL MODE ────────────────────────────────────────────────
  function renderHeaderFacts() {
    document.getElementById("pageTitle").textContent = event.reference ? `${event.reference} — ${event.title}` : event.title;
    const badge = document.getElementById("statusBadge");
    badge.style.display = "inline-block";
    badge.className = `badge ${COMMERCIAL_STATUS_BADGE[event.status]}`;
    badge.textContent = COMMERCIAL_STATUS_LABEL[event.status];

    document.getElementById("headerFacts").innerHTML = `
      <div><dt>Reference</dt><dd>${escapeHtml(event.reference) || "—"}</dd></div>
      <div><dt>Date Undertaken</dt><dd>${event.date_undertaken ? formatDate(event.date_undertaken) : "—"}</dd></div>
      <div><dt>Plot / Location</dt><dd>${event.plot_id ? escapeHtml((plots.find((p) => p.id === event.plot_id) || {}).plot_number || "—") : "—"}</dd></div>
      <div><dt>Total Value</dt><dd>${formatCommercialGBP(event.total_value) || "£0.00"}</dd></div>
      <div><dt>Created By</dt><dd>${escapeHtml(membersById[event.created_by] || "—")}</dd></div>
      <div><dt>Created</dt><dd>${formatDate(event.created_at?.slice(0, 10))}</dd></div>
    `;
    document.getElementById("grandTotal").textContent = formatCommercialGBP(event.total_value) || "£0.00";

    const unlocked = caps.canEdit && (event.status === "draft" || event.status === "rejected");
    document.getElementById("editHeaderBtn").style.display = unlocked ? "inline-flex" : "none";
    document.getElementById("lineItemAddRow").style.display = unlocked ? "flex" : "none";
    document.getElementById("addEvidenceRow").style.display = (unlocked && caps.canEdit) ? "flex" : "none";
  }

  function openEditHeader() {
    document.getElementById("eTitle").value = event.title;
    document.getElementById("eDate").value = event.date_undertaken || "";
    document.getElementById("ePlot").innerHTML = plotOptionsHtml(event.plot_id);
    document.getElementById("headerFacts").style.display = "none";
    document.getElementById("editHeaderBtn").style.display = "none";
    document.getElementById("editHeaderForm").style.display = "block";
  }
  document.getElementById("editHeaderBtn").addEventListener("click", openEditHeader);
  document.getElementById("cancelEditHeaderBtn").addEventListener("click", () => {
    document.getElementById("headerFacts").style.display = "grid";
    document.getElementById("editHeaderForm").style.display = "none";
    renderHeaderFacts();
  });
  document.getElementById("editHeaderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError(pageErrorBox);
    try {
      event = await updateDaywork(eventId, {
        title: document.getElementById("eTitle").value.trim(),
        dateUndertaken: document.getElementById("eDate").value || null,
        plotId: document.getElementById("ePlot").value || null,
      });
      document.getElementById("headerFacts").style.display = "grid";
      document.getElementById("editHeaderForm").style.display = "none";
      renderHeaderFacts();
    } catch (err) {
      showCommercialError(pageErrorBox, err);
    }
  });

  // ─── Line items ─────────────────────────────────────────────────
  function renderLineItems() {
    const tbcCount = lineItems.filter((li) => li.rate === null).length;
    const tbcWarning = document.getElementById("tbcWarning");
    if (tbcCount) {
      tbcWarning.style.display = "block";
      tbcWarning.textContent = `⚠ ${tbcCount} line item${tbcCount === 1 ? "" : "s"} still ${tbcCount === 1 ? "has" : "have"} TBC (to-be-confirmed) pricing — this Daywork can still be submitted, but the price won't be final until every line is priced.`;
    } else {
      tbcWarning.style.display = "none";
    }

    const unlocked = caps.canEdit && (event.status === "draft" || event.status === "rejected");
    document.getElementById("lineItemList").innerHTML = lineItems.map((li) => `
      <li class="item-row">
        <span class="badge badge-grey" style="flex:0 0 auto;">${COMMERCIAL_LINE_TYPE_LABEL[li.line_type]}</span>
        <span style="flex:1 1 200px;">${escapeHtml(li.description)}${li.trade ? ` <span class="hint">(${escapeHtml(li.trade)})</span>` : ""}</span>
        <span class="hint" style="flex:0 0 auto; white-space:nowrap;">${Number(li.quantity)}${li.unit ? " " + escapeHtml(li.unit) : ""} × ${li.rate === null ? "TBC" : formatCommercialGBP(li.rate)}</span>
        <strong style="flex:0 0 90px; text-align:right;">${li.line_total === null ? "TBC" : formatCommercialGBP(li.line_total)}</strong>
        ${unlocked ? `<button type="button" class="btn btn-sm btn-danger" data-delete-line="${li.id}">Delete</button>` : ""}
      </li>
    `).join("");
    document.querySelectorAll("[data-delete-line]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this line item?")) return;
        clearError(pageErrorBox);
        try {
          await deleteCommercialLineItem(btn.dataset.deleteLine);
          await reloadEvent();
        } catch (err) {
          showCommercialError(pageErrorBox, err);
        }
      });
    });
  }

  // Immediate-feedback-only preview as the user types, before the line
  // is saved — mirrors previewLineTotal()'s own doc comment in app.js:
  // never written back, never the value actually shown once a line
  // item exists (that's always the database's own generated column).
  function updateLinePreview() {
    const preview = previewLineTotal(document.getElementById("liQuantity").value, document.getElementById("liRate").value);
    document.getElementById("liPreview").textContent = preview === null ? "= TBC" : `= ${formatCommercialGBP(preview)}`;
  }
  document.getElementById("liQuantity").addEventListener("input", updateLinePreview);
  document.getElementById("liRate").addEventListener("input", updateLinePreview);
  updateLinePreview();

  document.getElementById("addLineItemBtn").addEventListener("click", async () => {
    clearError(pageErrorBox);
    const description = document.getElementById("liDescription").value.trim();
    if (!description) { showCommercialError(pageErrorBox, { message: "Enter a description for the line item first." }); return; }
    const rateVal = document.getElementById("liRate").value;
    const btn = document.getElementById("addLineItemBtn");
    btn.disabled = true;
    try {
      await addCommercialLineItem(eventId, {
        lineType: document.getElementById("liType").value,
        description,
        trade: document.getElementById("liTrade").value.trim() || null,
        quantity: document.getElementById("liQuantity").value || 1,
        unit: document.getElementById("liUnit").value.trim() || null,
        rate: rateVal === "" ? null : rateVal,
      });
      document.getElementById("liDescription").value = "";
      document.getElementById("liTrade").value = "";
      document.getElementById("liQuantity").value = "1";
      document.getElementById("liUnit").value = "";
      document.getElementById("liRate").value = "";
      updateLinePreview();
      await reloadEvent();
    } catch (err) {
      showCommercialError(pageErrorBox, err);
    } finally {
      btn.disabled = false;
    }
  });

  // ─── Evidence ───────────────────────────────────────────────────
  async function renderEvidence() {
    document.getElementById("evidenceEmpty").style.display = evidence.length ? "none" : "block";
    const unlocked = caps.canEdit && (event.status === "draft" || event.status === "rejected");
    const grid = document.getElementById("evidenceGrid");
    grid.innerHTML = evidence.map((ev) => `
      <div style="display:inline-block; vertical-align:top; margin:0 0.6rem 0.6rem 0; text-align:center;">
        <div class="hint" style="max-width:140px; word-break:break-word;">${escapeHtml(ev.document?.title || ev.caption || "Evidence")}</div>
        <a href="#" data-open-evidence="${ev.id}" class="hint">Open</a>
        ${unlocked ? ` · <a href="#" data-remove-evidence="${ev.id}" class="hint" style="color:var(--red);">Remove</a>` : ""}
      </div>
    `).join("");
    grid.querySelectorAll("[data-open-evidence]").forEach((a) => {
      a.addEventListener("click", async (e) => {
        e.preventDefault();
        const ev = evidence.find((x) => x.id === a.dataset.openEvidence);
        if (!ev?.document?.currentRevision) return;
        try {
          const url = await getDocumentFileUrl(ev.document.currentRevision);
          window.open(url, "_blank");
        } catch (err) {
          showCommercialError(pageErrorBox, err);
        }
      });
    });
    grid.querySelectorAll("[data-remove-evidence]").forEach((a) => {
      a.addEventListener("click", async (e) => {
        e.preventDefault();
        if (!confirm("Remove this evidence link? The underlying document itself is kept.")) return;
        clearError(pageErrorBox);
        try {
          await removeCommercialEvidenceLink(a.dataset.removeEvidence);
          evidence = await getCommercialEvidence(eventId);
          await renderEvidence();
        } catch (err) {
          showCommercialError(pageErrorBox, err);
        }
      });
    });
  }

  document.getElementById("evidenceFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    clearError(pageErrorBox);
    e.target.disabled = true;
    try {
      await addCommercialEvidencePhoto(eventId, projectId, file);
      evidence = await getCommercialEvidence(eventId);
      await renderEvidence();
    } catch (err) {
      showCommercialError(pageErrorBox, err);
    } finally {
      e.target.disabled = false;
      e.target.value = "";
    }
  });

  // ─── Workflow ───────────────────────────────────────────────────
  function attestationText(action, userEmail) {
    if (action === "submitted") return `Submit this Daywork for approval?\n\nBy continuing, you confirm the pricing and details above are accurate to the best of your knowledge. This will be recorded against your account (${userEmail}) with a timestamp, and the record cannot be edited again once submitted.\n\nThis is an internal confirmation within Site Tracker, not a legally binding external signature.`;
    if (action === "approved") return `Approve this Daywork?\n\nBy continuing, you confirm you have reviewed the pricing and evidence above and accept this record as final. This will be recorded against your account (${userEmail}) with a timestamp. Once approved, it becomes permanently locked — nobody, including you, will be able to edit it again.\n\nThis is an internal confirmation within Site Tracker, not a legally binding external signature.`;
    return "";
  }

  function renderWorkflow() {
    const details = document.getElementById("workflowDetails");
    const rows = [];
    if (event.submitted_by) rows.push(`<div><dt>Submitted by</dt><dd>${escapeHtml(membersById[event.submitted_by] || "—")} — ${formatDate(event.submitted_at?.slice(0, 10))}</dd></div>`);
    if (event.approved_by) rows.push(`<div><dt>Approved by</dt><dd>${escapeHtml(membersById[event.approved_by] || "—")} — ${formatDate(event.approved_at?.slice(0, 10))}</dd></div>`);
    if (event.rejected_by) rows.push(`<div><dt>Rejected by</dt><dd>${escapeHtml(membersById[event.rejected_by] || "—")} — ${formatDate(event.rejected_at?.slice(0, 10))}</dd></div>`);
    if (event.rejection_reason) rows.push(`<div><dt>Rejection reason</dt><dd>${escapeHtml(event.rejection_reason)}</dd></div>`);
    details.innerHTML = rows.length ? `<dl class="doc-facts">${rows.join("")}</dl>` : `<p class="hint">No workflow activity yet — this Daywork is still in Draft.</p>`;

    if (event.status === "approved") {
      details.innerHTML += `<p class="hint" style="margin-top:0.8rem;">This record is approved and permanently locked. If a correction is genuinely needed, contact your Commercial approver — a formal revision/supersession workflow is planned for a later phase, so for now any correction has to be handled outside Site Tracker.</p>`;
    }

    const actions = document.getElementById("workflowActions");
    actions.innerHTML = "";
    const add = (label, cls, handler) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `btn ${cls}`;
      btn.textContent = label;
      btn.addEventListener("click", handler);
      actions.appendChild(btn);
    };

    if (event.status === "draft" && caps.canSubmit) {
      add("Submit for Approval", "btn-amber", async () => {
        if (!lineItems.length) { showCommercialError(pageErrorBox, { message: "Add at least one line item before submitting." }); return; }
        if (!confirm(attestationText("submitted", membersById[currentUserId] || "you"))) return;
        clearError(pageErrorBox);
        try { await submitCommercialEvent(eventId); await reloadEvent(); }
        catch (err) { showCommercialError(pageErrorBox, err); }
      });
    }
    if (event.status === "submitted" && caps.canApprove) {
      const isOwnSubmission = event.created_by === currentUserId;
      if (isOwnSubmission) {
        actions.innerHTML += `<p class="hint">You submitted this Daywork yourself — you cannot approve or reject your own submission. Another Commercial approver on this project needs to.</p>`;
      } else {
        add("Approve", "btn-amber", async () => {
          if (!confirm(attestationText("approved", membersById[currentUserId] || "you"))) return;
          clearError(pageErrorBox);
          try { await approveCommercialEvent(eventId); await reloadEvent(); }
          catch (err) { showCommercialError(pageErrorBox, err); }
        });
        add("Reject", "btn-danger", () => {
          document.getElementById("rejectReason").value = "";
          document.getElementById("rejectModal").style.display = "flex";
        });
      }
    }
    if (event.status === "rejected" && caps.canEdit) {
      add("Return to Draft", "btn-outline", async () => {
        clearError(pageErrorBox);
        try { await reopenCommercialEvent(eventId); await reloadEvent(); }
        catch (err) { showCommercialError(pageErrorBox, err); }
      });
    }
  }

  document.getElementById("cancelRejectBtn").addEventListener("click", () => {
    document.getElementById("rejectModal").style.display = "none";
  });
  document.getElementById("confirmRejectBtn").addEventListener("click", async () => {
    clearError(pageErrorBox);
    try {
      await rejectCommercialEvent(eventId, document.getElementById("rejectReason").value.trim() || null);
      document.getElementById("rejectModal").style.display = "none";
      await reloadEvent();
    } catch (err) {
      showCommercialError(pageErrorBox, err);
    }
  });
  document.getElementById("rejectModal").addEventListener("click", (e) => {
    if (e.target === document.getElementById("rejectModal")) document.getElementById("rejectModal").style.display = "none";
  });

  async function reloadEvent() {
    event = await getDaywork(eventId);
    [lineItems, evidence, signatures] = await Promise.all([
      getCommercialLineItems(eventId),
      getCommercialEvidence(eventId),
      getCommercialSignatures(eventId),
    ]);
    renderHeaderFacts();
    renderLineItems();
    await renderEvidence();
    renderWorkflow();
  }

  async function initDetailMode() {
    document.getElementById("liType").innerHTML = COMMERCIAL_LINE_TYPES.map((t) => `<option value="${t}">${COMMERCIAL_LINE_TYPE_LABEL[t]}</option>`).join("");

    let baseEvent;
    try {
      baseEvent = await getDaywork(eventId);
    } catch (err) {
      showCommercialError(pageErrorBox, err);
      return;
    }
    projectId = baseEvent.project_id;
    const role = await getMyCommercialRole(projectId).catch(() => null);
    caps = commercialCapabilities(role);
    if (!caps.canView) { document.getElementById("noAccessCard").style.display = "block"; return; }

    const { data: { user } } = await supabase.auth.getUser();
    currentUserId = user.id;

    const [{ data: plotRows }, emailMap] = await Promise.all([
      supabase.from("plots").select("id, plot_number").eq("project_id", projectId),
      getMemberEmailMap([projectId]),
    ]);
    plots = (plotRows || []).slice().sort((a, b) => comparePlotNumbers(a.plot_number, b.plot_number));
    membersById = emailMap;

    document.getElementById("detailBody").style.display = "block";
    await reloadEvent();
  }

  async function init() {
    let projectNameForCrumb = null;
    if (eventId) {
      await initDetailMode();
      projectNameForCrumb = projectId;
    } else {
      await initCreateMode();
      projectNameForCrumb = projectId;
    }
    if (projectNameForCrumb) {
      const { data: project } = await supabase.from("projects").select("name").eq("id", projectNameForCrumb).single();
      renderHeader([
        { label: "Dashboard", href: "dashboard.html" },
        { label: project?.name || "Site", href: `project.html?id=${projectNameForCrumb}` },
        { label: "Commercial", href: `commercial-dashboard.html?project=${projectNameForCrumb}` },
        { label: "Dayworks", href: `dayworks.html?project=${projectNameForCrumb}` },
        { label: eventId ? (event?.reference || "Daywork") : "New Daywork" },
      ]);
      document.getElementById("projectSub").textContent = project ? project.name : "";
    }
  }

  init();
</script>
</body>
</html>
