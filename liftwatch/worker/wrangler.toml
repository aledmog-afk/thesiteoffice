# LiftWatch forecast proxy. Deploy: npx wrangler deploy (from this folder).
name = "liftwatch-forecast"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Free tier, non-commercial use only. For the commercial endpoint set
# OPEN_METEO_BASE_URL = "https://customer-api.open-meteo.com/v1/forecast"
# and add the key as a secret: npx wrangler secret put OPEN_METEO_API_KEY
OPEN_METEO_BASE_URL = "https://api.open-meteo.com/v1/forecast"
# The Pages site origin, e.g. "https://liftwatch.pages.dev". "*" while piloting.
ALLOWED_ORIGIN = "*"
